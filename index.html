<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stitch — Ohana Pocket</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --blue:#269eea;
  --light:#a5e4ff;
  --dark:#135aa6;
  --outline:#141720;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;padding:24px 12px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:22px;
  background:radial-gradient(circle at top,#253747,#121520);
  color:#edf7ff;font-family:monospace;
}
.console{
  width:340px;max-width:94vw;padding:24px;
  border:6px solid var(--outline);border-radius:36px 36px 22px 22px;
  background:var(--blue);
  box-shadow:inset 8px 8px var(--light),
    inset -8px -10px var(--dark),0 16px #090d15,
    0 24px 35px #0008;
}
.brand{
  margin-bottom:16px;text-align:center;color:var(--outline);
  font-weight:bold;letter-spacing:2px;font-size:12px;
}
.bezel{
  padding:12px;border:6px solid var(--outline);background:#7d83a8;
  box-shadow:inset 4px 4px #9aa0c4,inset -4px -4px #585d7e;
}
.screen{
  position:relative;aspect-ratio:128/160;
  border:5px solid var(--outline);background:#084358;overflow:hidden;
}
canvas{
  display:block;width:100%;height:100%;image-rendering:pixelated;
}
.hud{
  position:absolute;top:5px;left:5px;right:5px;
  z-index:2;display:flex;justify-content:space-between;
  gap:4px;pointer-events:none;
}
#clock{font-size:12px;font-weight:bold;color:#ffd166;text-shadow:1px 1px #000}
.bars{width:55%;display:grid;gap:4px}
.bar-row{display:flex;gap:4px;align-items:center}
.bar-row svg{width:12px;height:12px;flex-shrink:0;shape-rendering:crispEdges}
.track{flex:1;height:8px;border:1px solid #b8d6e3;background:#102437}
.track i{display:block;height:100%;width:0}
#happyFill{background:#ff789e}
#hungerFill{background:#ffc56b}
#menu{
  position:absolute;inset:0;z-index:5;padding:10px;overflow:auto;
  background:#18243bf5;font-size:14px;
}
#menu[hidden]{display:none}
#menu h3{margin:0 0 8px;font-size:16px;color:#ffd166}
.menu-row{padding:8px 4px}
.menu-row.active{color:var(--outline);background:var(--light)}
.controls{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:28px;gap:10px;
}
.dpad{position:relative;width:108px;height:108px;flex-shrink:0}
button{cursor:pointer;touch-action:manipulation;user-select:none}
button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
.direction{
  position:absolute;width:36px;height:36px;padding:0;
  border:5px solid var(--outline);background:#868eb2;
  box-shadow:inset 3px 3px #a5adc9,inset -3px -3px #616887;
  color:#192038;font-weight:bold;
}
.direction:active{background:#616887}
.up{top:0;left:36px;border-bottom:0}
.down{bottom:0;left:36px;border-top:0}
.left{left:0;top:36px;border-right:0}
.right{right:0;top:36px;border-left:0}
.center{position:absolute;left:36px;top:36px;width:36px;height:36px;background:#868eb2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px;width:120px}
.action{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;color:#141720;font-size:10px;font-weight:bold;
}
.round{
  width:32px;height:32px;border-radius:50%;
  border:5px solid var(--outline);background:#d45567;
  box-shadow:inset 3px 3px #ec7888,inset -3px -3px #9c3445;
}
.round:active{background:#9c3445}
.speaker{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.speaker i{
  width:14px;height:40px;border:4px solid var(--outline);
  border-radius:6px;background:#2a2f45;
}
#message{max-width:500px;margin:0;text-align:center;font-size:14px;line-height:1.6}
.help{max-width:500px;margin:0;text-align:center;color:#94a6c4;font-size:12px;line-height:1.7}
</style>
</head>

<body>
<main class="console">
  <div class="brand">OHANA POCKET PET</div>
  <div class="bezel">
    <div class="screen">
      <canvas id="gameCanvas" width="128" height="160"
        aria-label="Stitch"></canvas>
      <div class="hud">
        <span id="clock">00:00</span>
        <div class="bars">
          <div class="bar-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path fill="#ff789e"
                d="M1 2h4v1h2V2h4v5H9v2H7v2H5V9H3V7H1z"/>
            </svg>
            <div class="track" id="happyTrack" role="progressbar"
              aria-label="Vui vẻ" aria-valuemin="0" aria-valuemax="100">
              <i id="happyFill"></i>
            </div>
          </div>
          <div class="bar-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path fill="#ffc56b" d="M3 1h6v1h2v7H9v2H3V9H1V2h2z"/>
              <path fill="#af7038"
                d="M4 4h1v1H4zm3 2h1v1H7zM3 8h1v1H3z"/>
            </svg>
            <div class="track" id="hungerTrack" role="progressbar"
              aria-label="Độ đói" aria-valuemin="0" aria-valuemax="100">
              <i id="hungerFill"></i>
            </div>
          </div>
        </div>
      </div>
      <section id="menu" hidden></section>
    </div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="direction up" data-step="-1" aria-label="Lên">▲</button>
      <button class="direction down" data-step="1" aria-label="Xuống">▼</button>
      <button class="direction left" data-step="-1" aria-label="Trái">◀</button>
      <button class="direction right" data-step="1" aria-label="Phải">▶</button>
      <div class="center"></div>
    </div>
    <div class="actions">
      <div class="action">
        <button id="homeBtn" class="round" aria-label="HOME"></button>
        <span>HOME</span>
      </div>
      <div class="action">
        <button id="exitBtn" class="round" aria-label="EXIT"></button>
        <span>EXIT</span>
      </div>
      <div class="action">
        <button id="backBtn" class="round" aria-label="BACK"></button>
        <span>BACK</span>
      </div>
      <div class="action">
        <button id="selectBtn" class="round" aria-label="SELECT"></button>
        <span>SELECT</span>
      </div>
    </div>
  </div>
  <div class="speaker" aria-hidden="true"><i></i><i></i><i></i></div>
</main>

<p id="message" aria-live="polite">Đang tải Stitch…</p>
<p class="help">
  Phím hướng: chọn · Enter: SELECT · Esc: BACK<br>
  H: HOME · X: EXIT<br>
  Lưu cục bộ trong trình duyệt · Chưa đồng bộ ESP32<br>
  Chưa có thời tiết, giọng nói, báo thức hoặc nhắc nhở.
</p>

<script>
"use strict";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const HOUR = 3600000;
const KEY = "ohana-pet-v2";
const clamp = n => Math.max(0, Math.min(100, n));
const menu = document.getElementById("menu");
const message = document.getElementById("message");

let modelReady = false;
let modelError = "";
let drawPet = null;

function say(s) {
  message.textContent = s;
}

const initial = {
  version: 2,
  last: Date.now(),
  fed: Date.now(),
  happy: 80,
  energy: 85,
  clean: 100,
  health: 100,
  discipline: 70,
  waste: 0,
  digestion: [],
  sick: false,
  sleep: false,
  nextIll: Date.now() + (12 + Math.random() * 12) * HOUR
};

let saved = null;
try {
  saved = JSON.parse(localStorage.getItem(KEY));
} catch (e) {
  console.warn("Không đọc được trạng thái:", e);
}

let pet = saved && saved.version === 2
  ? {...initial, ...saved}
  : {...initial};

for (const k of [
  "last", "fed", "happy", "energy", "clean",
  "health", "discipline", "waste", "nextIll"
]) {
  if (!Number.isFinite(pet[k])) pet[k] = initial[k];
}

pet.digestion = Array.isArray(pet.digestion)
  ? pet.digestion.filter(Number.isFinite)
  : [];

pet.waste = Math.max(0, Math.floor(pet.waste));
pet.sleep = Boolean(pet.sleep);
pet.sick = Boolean(pet.sick);

let lastInput = Date.now();
let idleDance = false;
let idleCoconut = false;
let temporary = 0;
let animationEnd = 0;
let eventId = 0;
let meal = 0;
let storageWarned = false;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(pet));
  } catch (e) {
    if (!storageWarned) {
      console.warn("Không lưu được trạng thái:", e);
      storageWarned = true;
      say("Trình duyệt không cho lưu. Trạng thái có thể mất khi đóng trang.");
    }
  }
}

function touch() {
  lastInput = Date.now();
  idleDance = false;
  idleCoconut = false;
}

function hunger() {
  return clamp((Date.now() - pet.fed) / (9 * HOUR) * 100);
}

function busy() {
  return Boolean(pet.medicineDue || pet.cleaningDue);
}

function animate(pose, seconds = 5) {
  eventId++;
  temporary = pose;
  animationEnd = Date.now() + seconds * 1000;
}

let previousHud = "";

function updateHud() {
  const now = new Date();
  const clock =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

  const happy = Math.round(clamp(pet.happy));
  const hungry = Math.round(hunger());
  const key = clock + ":" + happy + ":" + hungry;

  if (key === previousHud) return;
  previousHud = key;

  document.getElementById("clock").textContent = clock;
  document.getElementById("happyFill").style.width = happy + "%";
  document.getElementById("hungerFill").style.width = hungry + "%";
  document.getElementById("hungerFill").style.background =
    hungry >= 80 ? "#ff6565" : "#ffc56b";

  document.getElementById("happyTrack")
    .setAttribute("aria-valuenow", happy);
  document.getElementById("hungerTrack")
    .setAttribute("aria-valuenow", hungry);
}

function update() {
  const now = Date.now();
  const hours = Math.max(0, (now - pet.last) / HOUR);
  pet.last = now;

  pet.happy = clamp(pet.happy - hours * 3);
  pet.energy = clamp(pet.energy + hours * (pet.sleep ? 15 : -4));
  pet.clean = clamp(pet.clean - hours * (pet.waste ? 6 : 1));

  pet.digestion = pet.digestion.filter(deadline => {
    if (deadline > now) return true;
    pet.waste++;
    return false;
  });

  const neglected =
    pet.clean < 40 || hunger() > 85 || pet.energy < 20;

  if (now >= pet.nextIll) {
    if (!pet.sick && neglected && Math.random() < 0.45) {
      pet.sick = true;
      say("Stitch thấy không khỏe. Cần chăm sóc và uống thuốc.");
    }
    pet.nextIll = now + (6 + Math.random() * 6) * HOUR;
  }

  pet.health = clamp(
    pet.health + hours * (pet.sick ? -3 : pet.sleep ? 2 : 0)
  );

  if (pet.cleaningDue && now >= pet.cleaningDue) {
    pet.waste = Math.max(0, pet.waste - (pet.cleaningCount || 0));
    pet.cleaningDue = 0;
    pet.cleaningCount = 0;
    pet.clean = clamp(pet.clean + 25);
    say("Stitch đã quét dọn xong.");
  }

  if (pet.medicineDue && now >= pet.medicineDue) {
    pet.medicineDue = 0;
    pet.sick = false;
    pet.health = clamp(pet.health + 25);
    say("Uống thuốc xong rồi! Vẫn cần nghỉ ngơi nhé.");
  }

  updateHud();
  save();
}

const tree = {
  home: [
    "Cho ăn", "Sức khỏe", "Vệ sinh", "Ngủ",
    "Nựng / Chơi", "Kỷ luật", "Thông tin"
  ],
  "Cho ăn": ["Cơm", "Trái cây", "Snack"],
  "Sức khỏe": ["Nghỉ ngơi", "Uống thuốc", "Tình trạng"],
  "Vệ sinh": ["Dọn chất thải"],
  "Ngủ": ["Đi ngủ", "Thức dậy"],
  "Nựng / Chơi": ["Nựng", "Chơi cùng"],
  "Kỷ luật": ["Nhắc nhở", "Khen"],
  "Thông tin": ["Chỉ số", "Bộ đếm", "Đồng hồ", "Kết nối"]
};

let page = "home";
let selected = 0;
let stack = [];
let opened = false;

function refreshMenu() {
  menu.hidden = !opened;
  if (!opened) return;

  menu.replaceChildren();
  const heading = document.createElement("h3");
  heading.textContent = page === "home" ? "MENU OHANA" : page;
  menu.append(heading);

  tree[page].forEach((label, i) => {
    const row = document.createElement("div");
    row.className = "menu-row" + (i === selected ? " active" : "");
    row.textContent = (i === selected ? "▶ " : "  ") + label;
    menu.append(row);
  });

  menu.children[selected + 1].scrollIntoView({block: "nearest"});
}

function home() {
  touch();
  page = "home";
  selected = 0;
  stack = [];
  opened = true;
  refreshMenu();
}

function exit() {
  touch();
  opened = false;
  refreshMenu();
}

function back() {
  touch();
  if (!opened) return;
  if (stack.length) {
    [page, selected] = stack.pop();
    refreshMenu();
  } else {
    exit();
  }
}

function move(step) {
  touch();
  if (!opened) return home();
  selected = (selected + step + tree[page].length) % tree[page].length;
  refreshMenu();
}

function duration(ms) {
  const m = Math.ceil(Math.max(0, ms) / 60000);
  return Math.floor(m / 60) + "h " + m % 60 + "p";
}

function showStats() {
  say(
    "Đói " + Math.round(hunger()) +
    " · Vui " + Math.round(pet.happy) +
    " · Sức khỏe " + Math.round(pet.health) +
    " · Năng lượng " + Math.round(pet.energy) +
    " · Vệ sinh " + Math.round(pet.clean) +
    " · Kỷ luật " + Math.round(pet.discipline) +
    " · Chất thải " + pet.waste +
    (pet.sick ? " · Đang ốm" : " · Không ốm")
  );
}

function select() {
  touch();
  update();
  if (!opened) return home();

  const action = tree[page][selected];

  if (tree[action]) {
    stack.push([page, selected]);
    page = action;
    selected = 0;
    refreshMenu();
    return;
  }

  const information =
    page === "Thông tin" || action === "Tình trạng";

  if (!information && !modelReady) {
    say(modelError
      ? "Model đang lỗi. Chưa thực hiện hoạt động."
      : "Chờ Stitch tải xong nhé.");
    return;
  }

  if (!information && busy()) {
    say("Chờ Stitch uống thuốc hoặc dọn xong nhé.");
    return;
  }

  if (["Cơm", "Trái cây", "Snack"].includes(action)) {
    if (pet.sleep) {
      say("Đánh thức Stitch trước nhé.");
    } else if (hunger() < 15) {
      say("Stitch còn no, chưa ăn thêm được.");
    } else {
      meal = ["Cơm", "Trái cây", "Snack"].indexOf(action);
      pet.fed = Date.now();
      pet.digestion.push(
        Date.now() + (45 + Math.random() * 45) * 60000
      );
      animate(1);
      say("Măm " + action.toLowerCase() + "! Độ đói tăng dần trong 9 giờ.");
    }

  } else if (action === "Dọn chất thải") {
    if (!pet.waste) {
      say("Chưa có chất thải để dọn.");
    } else if (pet.sleep) {
      say("Đánh thức Stitch trước nhé.");
    } else {
      pet.cleaningCount = pet.waste;
      pet.cleaningDue = Date.now() + 5000;
      animate(8);
      say("Stitch đang quét dọn.");
    }

  } else if (action === "Uống thuốc") {
    if (!pet.sick) {
      say("Stitch không ốm, không cần uống thuốc.");
    } else if (pet.sleep) {
      say("Đánh thức Stitch trước khi uống thuốc.");
    } else {
      pet.medicineDue = Date.now() + 5000;
      animate(9);
      say("Stitch đang uống thuốc rồi uống nước.");
    }

  } else if (action === "Đi ngủ" || action === "Nghỉ ngơi") {
    pet.sleep = true;
    animationEnd = 0;
    temporary = 0;
    eventId++;
    say("Stitch đang ngủ hồi năng lượng.");

  } else if (action === "Thức dậy") {
    pet.sleep = false;
    eventId++;
    say("Chào Ohana!");

  } else if (["Nựng", "Chơi cùng", "Khen"].includes(action)) {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else if (pet.sick && action === "Chơi cùng") {
      say("Stitch đang ốm, cần nghỉ.");
    } else if (pet.energy < 15 && action === "Chơi cùng") {
      say("Stitch quá mệt để chạy. Cho ngủ trước nhé.");
    } else {
      pet.happy = clamp(pet.happy + 15);
      if (action === "Chơi cùng") {
        pet.energy = clamp(pet.energy - 3);
        animate(14, 8);
      } else {
        animate(2);
      }
      say("Ohana! Vui quá!");
    }

  } else if (action === "Nhắc nhở") {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else {
      pet.discipline = clamp(pet.discipline + 5);
      animate(10);
      say("Nhắc nhẹ thôi nhé!");
    }

  } else if (action === "Chỉ số" || action === "Tình trạng") {
    showStats();

  } else if (action === "Bộ đếm") {
    say(
      "Rất đói sau " +
      duration(pet.fed + 7.2 * HOUR - Date.now()) +
      " · Đói hoàn toàn sau " +
      duration(pet.fed + 9 * HOUR - Date.now()) +
      " · Tiêu hóa: " +
      (pet.digestion.length
        ? duration(Math.min(...pet.digestion) - Date.now())
        : "không có bữa đang tiêu hóa")
    );

  } else if (action === "Đồng hồ") {
    say(new Date().toLocaleString("vi-VN"));

  } else {
    say("Đang chạy cục bộ. Chưa kết nối ESP32 hoặc nguồn đồng bộ.");
  }

  updateHud();
  save();
  opened = false;
  refreshMenu();
}

document.querySelectorAll("[data-step]").forEach(button => {
  button.onclick = () => move(Number(button.dataset.step));
});

document.getElementById("homeBtn").onclick = home;
document.getElementById("exitBtn").onclick = exit;
document.getElementById("backBtn").onclick = back;
document.getElementById("selectBtn").onclick = select;

document.addEventListener("keydown", e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (![
    "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
    "Enter", "Escape", "h", "x"
  ].includes(key)) return;

  e.preventDefault();

  if (e.repeat && ["Enter", "Escape", "h", "x"].includes(key)) return;

  if (key === "Enter") select();
  else if (key === "Escape") back();
  else if (key === "h") home();
  else if (key === "x") exit();
  else move(["ArrowUp", "ArrowLeft"].includes(key) ? -1 : 1);
});

function currentPose() {
  if (pet.medicineDue) return 9;
  if (pet.cleaningDue) return 8;
  if (pet.sleep) return 4;
  if (pet.sick) return 7;
  if (animationEnd) return temporary;

  const hour = new Date().getHours();
  return hour >= 22 || hour < 6 || pet.energy < 25 ? 13 : 0;
}

function loadingScreen() {
  ctx.fillStyle = "#084358";
  ctx.fillRect(0, 0, 128, 160);
  ctx.fillStyle = "#ffd166";
  ctx.font = "8px monospace";
  ctx.textAlign = "center";
  ctx.fillText(modelError ? "Lỗi tải Stitch" : "Đang tải Stitch...", 64, 78);
  if (modelError) ctx.fillText("Xem thông báo bên dưới", 64, 92);
  ctx.textAlign = "left";
}

let lastUpdate = 0;
let lastDraw = 0;

function loop(now) {
  if (now - lastUpdate >= 1000) {
    update();
    lastUpdate = now;
  }

  const time = Date.now();
  if (animationEnd && time >= animationEnd) {
    temporary = 0;
    animationEnd = 0;
  }

  const idle = time - lastInput;
  const hour = new Date().getHours();

  if (
    modelReady && !opened && !animationEnd && !busy() &&
    !pet.sleep && !pet.sick && pet.energy > 25 &&
    hour >= 6 && hour < 22
  ) {
    if (idle >= 90000 && !idleDance) {
      idleDance = true;
      animate(11, 12);
      say("Stitch nhảy Hawaii!");
    } else if (idle >= 120000 && !idleCoconut) {
      idleCoconut = true;
      animate(12, 10);
      say("Nghịch vỏ dừa thôi — không tính là ăn.");
    }
  }

  if (now - lastDraw >= 33) {
    lastDraw = now;
    if (modelReady && drawPet) {
      try {
        drawPet(ctx, currentPose(), pet.waste, meal, eventId, pet.sick);
      } catch (e) {
        modelReady = false;
        modelError = e.message || String(e);
        say("Lỗi dựng Stitch: " + modelError);
        loadingScreen();
      }
    } else {
      loadingScreen();
    }
  }

  requestAnimationFrame(loop);
}

update();
requestAnimationFrame(loop);
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

try {
  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: false,
    preserveDrawingBuffer: true
  });

  renderer.setPixelRatio(1);
  renderer.setSize(128, 160);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x537080, 2.2));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(3, 4, 5);
  scene.add(light);

  const camera = new THREE.OrthographicCamera(
    -1.15, 1.15, 1.65, -1.225, 0.01, 30
  );
  camera.position.set(0, 0.5, 8);
  camera.lookAt(0, 0.5, 0);

  const payload = await Promise.all(
    Array.from({length: 8}, async (_, i) => {
      const name = "model-part-" + i + ".txt";
      const response = await fetch("./" + name);
      if (!response.ok) throw new Error("Thiếu hoặc không đọc được " + name);
      return (await response.text()).replace(/\s+/g, "");
    })
  );

  let binary;
  try {
    binary = atob(payload.join(""));
  } catch (e) {
    throw new Error("Dữ liệu model không hợp lệ hoặc bị dán thiếu.");
  }

  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  const gltf = await new GLTFLoader().parseAsync(bytes.buffer, "");

  const root = gltf.scene;
  const pivot = new THREE.Group();
  scene.add(pivot);
  pivot.add(root);

  const bones = {};
  const rest = new Map();

  root.traverse(object => {
    if (object.isBone) {
      bones[object.name] = object;
      rest.set(object, {
        q: object.quaternion.clone(),
        p: object.position.clone(),
        s: object.scale.clone()
      });
    }
  });

  const bounds = new THREE.Box3().setFromObject(root);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());

  if (!Number.isFinite(size.y) || size.y <= 0) {
    throw new Error("Model không có kích thước hợp lệ.");
  }

  const scale = 1.65 / size.y;
  root.scale.multiplyScalar(scale);
  root.position.set(
    -center.x * scale,
    -bounds.min.y * scale - 0.8,
    -center.z * scale
  );

  const mixer = new THREE.AnimationMixer(root);
  const clips = gltf.animations;

  const idleClip = clips.find(c => c.name === "stch_bm_idle_dynamic");
  const runClip = clips.find(c => c.name === "stch_bm_runf");

  if (!idleClip || !runClip) {
    throw new Error("Model thiếu animation đứng nghỉ hoặc chạy cần dùng.");
  }

  function attach(name) {
    if (!bones[name]) throw new Error("Thiếu xương " + name);
    const group = new THREE.Group();
    bones[name].add(group);
    return group;
  }

  function box(parent, x, y, z, w, h, d, color) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({color})
    );
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
  }

  const mask = attach("Head_26");
  box(mask, 0, 0, 0.3, 0.52, 0.14, 0.03, 0x805fab);

  const patch = attach("Head_26");
  box(patch, 0, 0.2, 0.29, 0.3, 0.07, 0.02, 0xc7f4ff);

  const thermometer = attach("Jaw_33");
  box(thermometer, 0.2, 0, 0.22, 0.3, 0.025, 0.025, 0xffffff);
  box(thermometer, 0.34, 0, 0.22, 0.04, 0.04, 0.04, 0xee4545);

  const broom = attach("Hand_Right_20");
  box(broom, 0, -0.18, 0, 0.025, 0.6, 0.025, 0xb88648);
  box(broom, 0, -0.49, 0, 0.19, 0.1, 0.08, 0xe3c05a);

  const pill = attach("Hand_Right_20");
  box(pill, 0, 0, 0, 0.07, 0.03, 0.03, 0xffffff);

  const cup = attach("Hand_Right_20");
  box(cup, 0, 0, 0, 0.1, 0.16, 0.1, 0x78d5f2);

  const skirt = attach("Hips_41");
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    const leaf = box(
      skirt, Math.sin(a) * 0.24, -0.08, Math.cos(a) * 0.2,
      0.07, 0.24, 0.035, 0x479e58
    );
    leaf.rotation.y = a;
  }

  const crown = attach("Head_26");
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5;
    box(
      crown, Math.sin(a) * 0.28, 0.25, Math.cos(a) * 0.23,
      0.08, 0.06, 0.04, 0x479e58
    );
  }

  const food = attach("Hand_Left_11");
  const foodMesh = box(food, 0, 0, 0, 0.12, 0.07, 0.09, 0xffd18a);

  const shell = attach("Hand_Left_11");
  box(shell, 0, 0, 0, 0.14, 0.1, 0.1, 0x81512e);

  function rotate(name, x = 0, y = 0, z = 0) {
    const bone = bones[name];
    if (!bone) throw new Error("Thiếu xương chuyển động " + name);
    bone.quaternion.multiply(
      new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z))
    );
  }

  let active = -1;
  let previousEvent = -1;
  let start = 0;
  let activeAction = null;

  drawPet = function(context, pose, waste, mealId, actionId, sick) {
    const now = performance.now() / 1000;

    if (pose !== active || actionId !== previousEvent) {
      active = pose;
      previousEvent = actionId;
      start = now;
      mixer.stopAllAction();
      activeAction = null;
    }

    const t = now - start;

    context.fillStyle = pose === 4 ? "#030818" : "#084358";
    context.fillRect(0, 0, 128, 160);
    context.fillStyle = "#294755";
    context.fillRect(0, 137, 128, 1);

    for (const [bone, original] of rest) {
      bone.quaternion.copy(original.q);
      bone.position.copy(original.p);
      bone.scale.copy(original.s);
    }

    const running =
      pose === 14 &&
      ((t >= 1 && t < 3.7) || (t >= 4.3 && t < 7.5));

    const clip = running ? runClip : pose === 0 ? idleClip : null;

    if (clip) {
      const action = mixer.clipAction(clip);
      if (activeAction !== action) {
        mixer.stopAllAction();
        action.reset().play();
        activeAction = action;
      }
      mixer.setTime(running ? t * 1.2 : t * 0.7);
    } else if (activeAction) {
      mixer.stopAllAction();
      activeAction = null;
    }

    for (const name of ["Anchor_0", "Anchor_CM_Node_1"]) {
      const bone = bones[name];
      const original = rest.get(bone);
      if (bone && original) bone.position.copy(original.p);
    }

    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);

    if (pose === 14) {
      let x = 64;
      if (t >= 1 && t < 3.7) {
        x = 64 + (t - 1) / 2.7 * 118;
      } else if (t >= 3.7 && t < 4.3) {
        x = 185;
      } else if (t >= 4.3) {
        x = -48 + 112 * Math.min(1, (t - 4.3) / 3.2);
      }

      pivot.position.x = (x - 64) * 2.3 / 128;
      pivot.rotation.y = running
        ? (t < 4.3 ? Math.PI / 2 : -Math.PI / 2)
        : 0;

      if (t < 1) {
        rotate("Shoulder_Right_18", -0.6 * Math.sin(t * Math.PI));
        rotate("Elbow_Right_19", -0.4 * Math.sin(t * Math.PI));
      }
    }

    if (pose === 4) {
      rotate("Thigh_Left_43", -0.35);
      rotate("Thigh_Right_49", -0.35);
      rotate("Knee_Left_44", 0.6);
      rotate("Knee_Right_50", 0.6);
      rotate("Shoulder_Left_9", 0, 0, 0.45);
      rotate("Shoulder_Right_18", 0, 0, -0.45);
      pivot.rotation.z = Math.PI / 2;
      pivot.position.set(0.15, -0.45 + Math.sin(t * 1.4) * 0.008, 0);
    }

    if (pose === 1 || pose === 12) {
      const a = (1 - Math.cos(t * 3)) * 0.5;
      rotate("Shoulder_Left_9", -0.5 - a * 0.25);
      rotate("Elbow_Left_10", -0.8 - a * 0.45);
      rotate("Jaw_33", Math.max(0, Math.sin(t * 6)) * 0.18);
      foodMesh.material.color.setHex(
        [0xfff1d1, 0x7acb64, 0xd39b55][mealId] || 0xfff1d1
      );
    }

    if (pose === 2) {
      rotate("Spine2_5", 0, Math.sin(t * 2) * 0.1);
      rotate("Shoulder_Left_9", 0, 0, -0.5 - Math.sin(t * 3) * 0.15);
      rotate("Shoulder_Right_18", 0, 0, 0.5 + Math.sin(t * 3) * 0.15);
      pivot.position.y = Math.abs(Math.sin(t * 3)) * 0.035;
    }

    if (pose === 10) {
      rotate("Neck_25", Math.sin(t * 3) * 0.1);
      rotate("Shoulder_Right_18", -0.3);
    }

    if (pose === 11) {
      const a = Math.sin(t * 3);
      rotate("Spine2_5", 0, a * 0.15, a * 0.08);
      rotate("Shoulder_Left_9", 0, 0, -0.8 + a * 0.3);
      rotate("Shoulder_Right_18", 0, 0, 0.8 + a * 0.3);
      rotate("Thigh_Left_43", a * 0.22);
      rotate("Thigh_Right_49", -a * 0.22);
    }

    if (pose === 7) {
      rotate("Spine2_5", 0.15);
      rotate("Neck_25", 0.2);
    }

    if (pose === 13) {
      const a = Math.max(0, Math.sin(t * 0.9));
      rotate("Jaw_33", a * 0.35);
      rotate("Neck_25", -0.1 * a);
    }

    if (pose === 8) {
      rotate("Shoulder_Right_18", 0.4, 0, Math.sin(t * 4) * 0.3);
      rotate("Elbow_Right_19", 0.4);
      rotate("Spine2_5", 0, Math.sin(t * 4) * 0.05);
    }

    if (pose === 9) {
      const a = t < 2
        ? Math.min(1, t / 1.6)
        : Math.min(1, (t - 2) / 1.1);
      rotate("Shoulder_Right_18", -a * 0.8);
      rotate("Elbow_Right_19", -a * 1.1);
    }

    food.visible = pose === 1;
    shell.visible = pose === 12;
    mask.visible = pose === 4;
    patch.visible = pose === 7 || pose === 9 || (sick && pose === 4);
    thermometer.visible = pose === 7;
    broom.visible = pose === 8;
    pill.visible = pose === 9 && t < 2;
    cup.visible = pose === 9 && t >= 2;
    skirt.visible = crown.visible = pose === 11;

    renderer.render(scene, camera);
    context.imageSmoothingEnabled = false;
    context.drawImage(renderer.domElement, 0, 0);

    if (pose === 4) {
      context.fillStyle = "#def6ff";
      context.fillRect(8, 115, 24, 16);
      context.fillStyle = "#418bbc";
      context.fillRect(49, 112, 63, 23);
      context.fillStyle = "#9adfff";
      context.fillRect(49, 112, 63, 3);
      context.fillStyle = "#c7e8ff";
      context.font = "8px monospace";
      context.fillText("Zz", 98, 80 - Math.sin(t) * 2);
    }

    if (pose === 14) {
      const x = 88 + t * 27;
      if (x < 140) {
        context.save();
        context.translate(x, 131);
        context.rotate(t * 5);
        context.fillStyle = "#81512e";
        context.fillRect(-5, -5, 10, 10);
        context.fillStyle = "#c39b66";
        context.fillRect(-3, -4, 3, 2);
        context.restore();
      }
    }

    if (pose === 2) {
      context.fillStyle = "#ff789e";
      for (let i = 0; i < 2; i++) {
        const x = 12 + i * 96;
        const y = 90 - (t * 18 + i * 12) % 35;
        context.fillRect(x, y, 3, 3);
        context.fillRect(x + 5, y, 3, 3);
        context.fillRect(x, y + 3, 8, 3);
        context.fillRect(x + 2, y + 6, 4, 2);
      }
    }

    if (waste) {
      context.fillStyle = "#81512e";
      context.fillRect(109, 130, 9, 4);
      context.fillRect(111, 127, 5, 3);
    }
  };

  modelReady = true;
  modelError = "";
  say("Ohana! HOME mở menu.");

} catch (e) {
  modelReady = false;
  modelError = e.message || String(e);
  say("Không tải được Stitch: " + modelError);
  console.error(e);
}
</script>
</body>
</html>
