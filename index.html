<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch — Ohana Pocket</title>

<style>
:root {
  --shell: #269eea;
  --light: #a5e4ff;
  --dark: #135aa6;
  --border: #141720;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background:
    radial-gradient(circle at 20% 20%, #23283d, transparent 45%),
    radial-gradient(circle at 80% 80%, #1c323a, transparent 45%),
    #121520;
  color: #eef5ff;
  font-family: monospace;
}

.console {
  width: 340px;
  max-width: 94vw;
  padding: 24px;
  background: var(--shell);
  border: 6px solid var(--border);
  border-radius: 36px 36px 22px 22px;
  box-shadow:
    inset 8px 8px 0 var(--light),
    inset -8px -10px 0 var(--dark),
    0 18px 0 #0b0d14,
    0 26px 40px #0008;
}

.brand {
  margin-bottom: 18px;
  text-align: center;
  color: var(--border);
  font: bold 12px monospace;
  letter-spacing: 2px;
}

.bezel {
  padding: 12px;
  background: #7d83a8;
  border: 6px solid var(--border);
  box-shadow:
    inset 4px 4px 0 #a5adc9,
    inset -4px -4px 0 #585d7e;
}

.screen {
  position: relative;
  aspect-ratio: 128 / 160;
  overflow: hidden;
  background: #084358;
  border: 5px solid var(--border);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    #ffffff06 0 2px,
    transparent 2px 4px
  );
}

/* Giờ và hai thanh chỉ dùng biểu tượng. */
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 5px;
  padding: 6px 5px;
  background: #084358;
  pointer-events: none;
}

.clock {
  padding-top: 3px;
  color: #ffd166;
  font: bold 12px monospace;
  white-space: nowrap;
}

.status-bars {
  display: grid;
  gap: 4px;
  width: 58%;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 12px;
}

.status-row svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  shape-rendering: crispEdges;
}

.track {
  flex: 1;
  height: 8px;
  border: 1px solid #bddce8;
  background: #102437;
  overflow: hidden;
}

.fill {
  display: block;
  height: 100%;
  width: 0;
}

#spiritFill { background: #ff789e; }
#hungerFill { background: #ffc56b; }

.menu {
  position: absolute;
  inset: 0;
  z-index: 3;
  padding: 10px;
  overflow: auto;
  background: #18243bf5;
  font: 14px monospace;
}

.menu[hidden] {
  display: none;
}

.menu h3 {
  margin: 0 0 10px;
  color: #ffd166;
  font-size: 15px;
}

.menu-row {
  padding: 7px 3px;
  line-height: 1.3;
}

.menu-row.active {
  background: var(--light);
  color: var(--border);
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
}

.dpad {
  position: relative;
  width: 108px;
  height: 108px;
  flex-shrink: 0;
}

.dpad button {
  position: absolute;
  width: 36px;
  height: 36px;
  padding: 0;
  color: var(--border);
  background: #868eb2;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #a5adc9,
    inset -3px -3px 0 #616887;
}

.up {
  top: 0;
  left: 36px;
  border-bottom: none !important;
}

.down {
  bottom: 0;
  left: 36px;
  border-top: none !important;
}

.left {
  top: 36px;
  left: 0;
  border-right: none !important;
}

.right {
  top: 36px;
  right: 0;
  border-left: none !important;
}

.center {
  position: absolute;
  top: 36px;
  left: 36px;
  width: 36px;
  height: 36px;
  background: #868eb2;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, 58px);
  gap: 20px 2px;
  text-align: center;
}

.actions button {
  display: block;
  width: 30px;
  height: 30px;
  margin: auto;
  padding: 0;
  border-radius: 50%;
  background: #d45567;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #ec7888,
    inset -3px -3px 0 #9c3445;
}

.actions span {
  display: block;
  margin-top: 8px;
  color: var(--border);
  font: bold 9px monospace;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  filter: brightness(.8);
  transform: translateY(2px);
}

button:focus-visible {
  outline: 3px solid #ffd166;
  outline-offset: 2px;
}

.speaker {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}

.speaker i {
  width: 14px;
  height: 44px;
  border: 4px solid var(--border);
  border-radius: 6px;
  background: #2a2f45;
}

footer {
  max-width: 360px;
  text-align: center;
  color: #adbbd4;
  font-size: 12px;
  line-height: 1.8;
}

#message {
  margin-bottom: 8px;
  color: #ffd166;
}
</style>
</head>

<body>
<main class="console">
  <div class="brand">OHANA POCKET PET</div>

  <div class="bezel">
    <div class="screen">
      <canvas
        id="petCanvas"
        width="128"
        height="160"
        aria-label="Stitch pixel"
      ></canvas>

      <div class="hud">
        <time class="clock" id="petClock">00:00</time>

        <div class="status-bars">
          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ff789e"
                d="M1 2h4v1h2V2h4v5H9v2H7v2H5V9H3V7H1z"
              />
              <path fill="#ffd1e0" d="M2 3h2v1H2z"/>
            </svg>

            <div
              class="track"
              id="spiritTrack"
              role="progressbar"
              aria-label="Tinh thần"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <i class="fill" id="spiritFill"></i>
            </div>
          </div>

          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ffc56b"
                d="M3 1h6v1h2v7H9v2H3V9H1V2h2z"
              />
              <path
                fill="#995c2d"
                d="M4 3h2v2H4zM8 5h1v2H8zM3 7h2v2H3z"
              />
            </svg>

            <div
              class="track"
              id="hungerTrack"
              role="progressbar"
              aria-label="Độ đói"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <i class="fill" id="hungerFill"></i>
            </div>
          </div>
        </div>
      </div>

      <section id="menu" class="menu" hidden></section>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Chọn mục menu">
      <button class="up" data-step="-1" aria-label="Lên">▲</button>
      <button class="left" data-step="-1" aria-label="Trái">◀</button>
      <div class="center"></div>
      <button class="right" data-step="1" aria-label="Phải">▶</button>
      <button class="down" data-step="1" aria-label="Xuống">▼</button>
    </div>

    <div class="actions">
      <div>
        <button id="home" aria-label="Home"></button>
        <span>HOME</span>
      </div>
      <div>
        <button id="back" aria-label="Back"></button>
        <span>BACK</span>
      </div>
      <div>
        <button id="select" aria-label="Select"></button>
        <span>SELECT</span>
      </div>
      <div>
        <button id="exit" aria-label="Exit"></button>
        <span>EXIT</span>
      </div>
    </div>
  </div>

  <div class="speaker" aria-hidden="true">
    <i></i><i></i><i></i>
  </div>
</main>

<footer>
  <div id="message" aria-live="polite"></div>
  Pixel 2D, không dùng model 3D • Chưa đồng bộ ESP32 / Adafruit<br>
  Phím hướng: chọn · Enter: xác nhận · Esc: quay lại<br>
  H: HOME · X: EXIT
</footer>

<script>
"use strict";

/* Sprite Stitch pixel, bảng màu RGB565. */
const palette = [
  0, 8452, 15218, 36411,
  38037, 2152, 65535, 63887
];

const pixels = `
000000000000000000000000000000000000000000000
000000000000000000000000000000000001110000000
000000000000000000000000000000000001111000000
000000000000000000000000000000000001441100000
000000000000000000000000000000000001444110000
001111111000000000000000000000000001444411000
001111111000000000000000000000000001444441100
001444441000000000000000000000000001444444110
001444441000000000000000000000000001444444110
001444441000000000001110000000000001444444110
001444441000000000111111111100000001444444110
001444441000000011112222211111000001444444410
001444441000000112222222222221110001444444410
001444441000001122222222222222211001444444410
001444441000011222222222222222221101444444410
001444441000012332222222222233332101444444410
001444441000123333222222222233333111444444410
001444441001333333222222222233333311444444410
001444441112311333222222222233111311444444110
001444444113111133222222222231661131444410000
001144444111166113222222222231661111444410000
000144444131166113555555555231111111444410000
000114441111111113555555555531111111444410000
000014444111111113555555555531116111444110000
000011444111111113555555555533111111141110000
000011144111111133555555555533111131111100000
000000111111333333555555555533333310011000000
000000001111233333225555555233333100000000000
000000000001111222222555552222211000000000000
000000000000111111111111111111110000000000000
000000000000000022333333333321000000000000000
000000000000000112233333333321000000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322200000000000000
000000000000000212233333333322210000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322121000000000000
000000000000012221223333333322221100000000000
000000111111112221223333333222221100000000000
000000222211112221223333333221211111111000000
000001222221112222123333333221211122211110000
000012222222112222123333333221211122222111000
000012555522112222123333333212211122222211000
000012555522111222123333333212211122555521000
000012555522122122123333333212211122555521000
000011222222112111111111111211111122555521000
000011111111111111000000011111111111222211000
000000000000000000000000000000000011111110000
000000000000000000000000000000000000000000000
`.trim().split(/\s+/).map(row => Array.from(row, Number));

const canvas = document.getElementById("petCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const panel = document.getElementById("menu");
const message = document.getElementById("message");

const clockElement = document.getElementById("petClock");
const spiritFill = document.getElementById("spiritFill");
const hungerFill = document.getElementById("hungerFill");
const spiritTrack = document.getElementById("spiritTrack");
const hungerTrack = document.getElementById("hungerTrack");

const state = {
  pose: 0,
  meal: 0,
  waste: 0
};

function color(value) {
  const r = Math.round(((value >> 11) & 31) * 255 / 31);
  const g = Math.round(((value >> 5) & 63) * 255 / 63);
  const b = Math.round((value & 31) * 255 / 31);
  return `rgb(${r},${g},${b})`;
}

function rect(x, y, w, h, c) {
  ctx.fillStyle = color(c);
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function text(x, y, value, c = 0xffff, size = 8) {
  ctx.fillStyle = color(c);
  ctx.font = size + "px monospace";
  ctx.fillText(value, x, y);
}

function ink(x, y, pose, frame) {
  let c = pixels[y][x];

  const eyes =
    (x >= 10 && x <= 16 && y >= 18 && y <= 25) ||
    (x >= 29 && x <= 34 && y >= 18 && y <= 25);

  if (eyes && [2, 3, 4, 7].includes(pose)) {
    const center = x < 20 ? 13 : 31;

    c = pose === 2
      ? (y === 21 + (Math.abs(x - center) > 1 ? 1 : 0) ? 1 : 3)
      : (y === 23 ? 1 : 3);
  }

  if (x >= 19 && x <= 27 && y >= 28 && y <= 29) {
    if (pose === 1) c = frame ? 7 : 1;
    if (pose === 2) c = y === 28 && x > 20 && x < 26 ? 7 : 1;
    if (pose === 7) c = y === 28 && x > 20 && x < 26 ? 1 : 2;
  }

  if (
    pose === 2 && y === 26 &&
    ((x >= 12 && x <= 14) || (x >= 31 && x <= 33))
  ) {
    c = 7;
  }

  return c;
}

function heart(x, y) {
  rect(x, y, 3, 3, 0xf98f);
  rect(x + 5, y, 3, 3, 0xf98f);
  rect(x, y + 3, 8, 3, 0xf98f);
  rect(x + 2, y + 6, 4, 2, 0xf98f);
}

/*
  0 bình thường; 1 ăn; 2 vui; 3 chớp mắt; 4 ngủ;
  7 ốm; 8 dọn; 9 thuốc; 10 kỷ luật;
  11 Hawaii; 12 dừa; 13 buồn ngủ.
*/
// Pixel geometry is drawn on the same integer grid as the face.
let poseStart=Date.now(), drawnPose=-1;
function poly(points,c){ctx.fillStyle=color(c);ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(Math.round(x),Math.round(y)):ctx.moveTo(Math.round(x),Math.round(y)));ctx.closePath();ctx.fill();}
function limb(a,b,c,width=7){
 const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
 const nx=-dy/len*width/2,ny=dx/len*width/2;
 poly([[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]],0x2104);
 poly([[a[0]+nx*.65,a[1]+ny*.65],[b[0]+nx*.65,b[1]+ny*.65],[b[0]-nx*.65,b[1]-ny*.65],[a[0]-nx*.65,a[1]-ny*.65]],c);
}
function head(cx,top,expression,blink=false){
 // Keep the approved face, but never stretch or rotate its seated body.
 for(let ay=0;ay<30;ay++)for(let ax=0;ax<45;ax++){
  let c=ink(ax,ay,expression,blink?0:1);
  if(expression===13 && ay>=18&&ay<=21&&((ax>=10&&ax<=16)||(ax>=29&&ax<=34)))c=3;
  if(c)rect(cx-45+ax*2,top+ay*2,2,2,palette[c]);
 }
 if(expression===13){rect(cx-8,top+55,16,9,0x2104);rect(cx-6,top+55,12,2,0xffff);rect(cx-4,top+61,8,3,0xf98f);}
}
function render(pose,frame){
 if(drawnPose!==pose){drawnPose=pose;poseStart=Date.now();}
 const t=(Date.now()-poseStart)/1000;
 const dance=pose===11, play=pose===14;
 const running=play&&t>=.8&&t<7.5;
 const phase=t*(running?11:3), wave=Math.sin(phase);
 rect(0,0,128,160,pose===4?0x0001:0x0843);rect(0,137,128,1,0x2152);
 if(pose===4){
  // A separately drawn horizontal sleeping pose, not a rotated seated sprite.
  rect(8,118,32,18,0xffff);
  poly([[13,111],[7,104],[10,96],[22,100],[33,108],[38,118],[30,130],[17,129],[11,123]],0x2104);
  poly([[15,112],[10,104],[12,100],[22,104],[33,112],[35,120],[29,127],[18,125]],0x3b72);
  poly([[19,107],[22,98],[36,101],[43,110],[42,121],[32,128],[22,123]],0x3b72);
  rect(23,108,18,7,0x5295);rect(25,110,14,2,0x2104);rect(34,117,9,5,0x020f);
  const breath=Math.round(Math.sin(t*1.6));
  poly([[40,116+breath],[49,111+breath],[93,112],[110,121],[111,135],[39,135]],0x2104);
  poly([[42,118+breath],[51,114+breath],[92,115],[107,123],[108,132],[42,132]],0x3b72);
  rect(43,116+breath,51,3,0x65ff);for(let i=0;i<5;i++)rect(53+i*10,123,3,3,0x65ff);
  if(pet.sick)rect(25,102,12,3,0xafff);
  text(88,87-Math.floor(t%3)*3,'Zz',0xffff);
 }else{
 let cx=64,top=46;
 const standing=dance||pose===8||play;
 if(play){if(t>=.8&&t<3.5)cx=64+(t-.8)/2.7*120;else if(t>=3.5&&t<4.2)cx=184;else if(t>=4.2&&t<7.5)cx=-52+(t-4.2)/3.3*116;}
 if(dance)cx+=Math.round(wave*3);
 if(standing)top=34+Math.round(Math.abs(wave)*(running?2:1));
 if(pose===7)top+=3;
 const shoulderY=top+61,hipY=standing?119:125;
 const lift=running?wave*7:dance?wave*3:0;
 // Legs are articulated at the hip, knee and ankle, with counter-phase steps.
 for(const side of [-1,1]){
 const hip=[cx+side*8,hipY-4],knee=[cx+side*(standing?10:20)+lift*side,standing?126:130];
 const foot=[cx+side*(standing?12:26)-lift*side,134-Math.max(0,lift*side)];
 limb(hip,knee,0x3b72,11);limb(knee,foot,0x3b72,10);
 rect(foot[0]-7,foot[1]-2,15,5,0x2104);rect(foot[0]-5,foot[1]-2,11,3,0x3b72);
 }
 poly([[cx-15,shoulderY-3],[cx+14,shoulderY-3],[cx+18,hipY-2],[cx+9,hipY+3],[cx-12,hipY+3],[cx-18,hipY-3]],0x2104);
 poly([[cx-12,shoulderY],[cx+11,shoulderY],[cx+14,hipY-3],[cx+7,hipY],[cx-10,hipY],[cx-14,hipY-4]],0x3b72);
 poly([[cx-7,shoulderY],[cx+7,shoulderY],[cx+9,hipY-5],[cx+5,hipY-1],[cx-6,hipY-1]],0x8e3b);
 let right=[cx+19,hipY-3],left=[cx-19,hipY-3];
 if(running){right=[cx+20+wave*9,shoulderY+15-wave*8];left=[cx-20-wave*9,shoulderY+15+wave*8];}
 if(dance){right=[cx+28,shoulderY+wave*6];left=[cx-28,shoulderY-wave*6];}
 if(pose===8)right=[cx+26+wave*5,112];
 if([1,9,12].includes(pose)){
  const a=(1-Math.cos(Math.min(t,4)*Math.PI/2))/2;
  if(pose===9)right=[cx+15-a*10,shoulderY+16-a*21];else left=[cx-17+a*12,shoulderY+16-a*20];
 }
 for(const [side,hand]of [[-1,left],[1,right]]){
 const shoulder=[cx+side*13,shoulderY+1],elbow=[(shoulder[0]+hand[0])/2+side*3,(shoulder[1]+hand[1])/2+4];
 limb(shoulder,elbow,0x3b72,8);limb(elbow,hand,0x3b72,8);rect(hand[0]-4,hand[1]-3,8,7,0x3b72);
 }
 head(cx,top,pose,Math.floor(t*10)%40===0);
 if(dance){for(let i=0;i<7;i++)poly([[cx-18+i*5,116],[cx-13+i*5,116],[cx-14+i*5,125+i%2]],i%2?0x35a7:0x5ca6);for(let i=0;i<6;i++)rect(cx-19+i*7,top+23+Math.abs(i-2)*2,5,4,0x5ca6);}
 if(pose===7){rect(cx-11,top+31,22,4,0xafff);rect(cx+5,top+57,21,2,0xffff);rect(cx+24,top+56,4,4,0xf800);}
 if(pose===8){rect(right[0],right[1]-10,2,25,0xb346);rect(right[0]-5,right[1]+15,12,5,0xd5aa);for(let i=0;i<4;i++)rect(right[0]-5+i*3,right[1]+19,1,3,0xb346);}
 if(pose===9){if(t<2.5){rect(right[0]-2,right[1]-4,5,3,0xffff);rect(right[0],right[1]-4,2,3,0xf98f);}else{rect(right[0]-4,right[1]-8,9,10,0x65ff);rect(right[0]-3,right[1]-8,7,2,0xffff);}}
 if(pose===1)rect(left[0]-4,left[1]-5,10,6,[0xffff,0x07e0,0xfd20][state.meal]);
 if(pose===12){rect(left[0]-5,left[1]-7,12,9,0x8200);rect(left[0]-3,left[1]-7,8,2,0xc618);}
 if(pose===2)heart(20,65-Math.round(t*10)%25);
 if(play&&t<3.5){let x=84+t*36;rect(x,129,10,8,0x8200);rect(x+2,129,5,2,0xc618);}
 }
 if(state.waste){rect(107,130,10,4,0x8200);rect(109,127,6,3,0x8200);}
}

/* Luật nuôi và lưu trạng thái. */
const KEY = "ohana-pet-v2";
const HOUR = 3600000;

let pet;

try {
  pet = JSON.parse(localStorage.getItem(KEY));
} catch (error) {}

if (!pet || pet.version !== 2) {
  pet = {
    version: 2,
    last: Date.now(),
    fed: Date.now(),
    happy: 80,
    energy: 85,
    clean: 100,
    health: 100,
    discipline: 70,
    waste: 0,
    digestion: [],
    sick: false,
    sleep: false,
    nextIll: Date.now() + 12 * HOUR + Math.random() * 12 * HOUR
  };
}

let lastInput = Date.now();
let idleDance = false;
let idleCoconut = false;
let temporary = 0;
let end = 0;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(pet));
  } catch (error) {}
}

function say(value) {
  message.textContent = value;
}

function touch() {
  lastInput = Date.now();
  idleDance = false;
  idleCoconut = false;
}

function animate(pose, seconds = 5) {
  temporary = pose;
  end = Date.now() + seconds * 1000;
}

function hunger() {
  return Math.min(
    100,
    Math.max(0, (Date.now() - pet.fed) / (9 * HOUR) * 100)
  );
}

let previousHud = "";

function updateHud() {
  const now = new Date();
  const clock =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

  const spirit = Math.round(Math.max(0, Math.min(100, pet.happy)));
  const hungry = Math.round(hunger());
  const key = clock + ":" + spirit + ":" + hungry;

  if (key === previousHud) return;
  previousHud = key;

  clockElement.textContent = clock;
  spiritFill.style.width = spirit + "%";
  hungerFill.style.width = hungry + "%";
  hungerFill.style.background = hungry >= 80 ? "#ff6565" : "#ffc56b";

  spiritTrack.setAttribute("aria-valuenow", spirit);
  hungerTrack.setAttribute("aria-valuenow", hungry);
}

function update() {
  const now = Date.now();
  const hours = Math.max(0, (now - pet.last) / HOUR);

  pet.last = now;
  pet.happy = Math.max(0, pet.happy - hours * 3);

  pet.energy = Math.max(0, Math.min(
    100,
    pet.energy + hours * (pet.sleep ? 15 : -4)
  ));

  pet.clean = Math.max(
    0,
    pet.clean - hours * (pet.waste ? 6 : 1)
  );

  pet.digestion = pet.digestion.filter(deadline => {
    if (deadline <= now) {
      pet.waste++;
      return false;
    }
    return true;
  });

  const neglected =
    pet.clean < 40 || hunger() > 85 || pet.energy < 20;

  if (now >= pet.nextIll) {
    if (neglected && Math.random() < 0.45) {
      pet.sick = true;
      say("Stitch thấy không khỏe, cần chăm sóc.");
    }

    pet.nextIll = now + 6 * HOUR + Math.random() * 6 * HOUR;
  }

  pet.health = Math.max(0, Math.min(
    100,
    pet.health + hours * (pet.sick ? -3 : pet.sleep ? 2 : 0)
  ));

  if(pet.medicineDue && now>=pet.medicineDue){pet.medicineDue=0;pet.sick=false;pet.health=Math.min(100,pet.health+25);say("Uống xong rồi, Ohana!");}
  if(pet.cleaningDue && now>=pet.cleaningDue){pet.cleaningDue=0;pet.waste=Math.max(0,pet.waste-(pet.cleaningCount||0));pet.cleaningCount=0;pet.clean=Math.min(100,pet.clean+25);say("Đã quét dọn xong.");}
  state.waste = pet.waste;
  updateHud();
  save();
}

/* Cần gạt chỉ chọn mục. SELECT xác nhận. */
const tree = {
  home: [
    "Cho ăn", "Sức khỏe", "Vệ sinh", "Ngủ",
    "Nựng / Chơi", "Kỷ luật", "Thông tin"
  ],
  "Cho ăn": ["Cơm", "Trái cây", "Snack"],
  "Sức khỏe": ["Nghỉ ngơi", "Uống thuốc", "Tình trạng"],
  "Vệ sinh": ["Dọn chất thải"],
  "Ngủ": ["Đi ngủ", "Thức dậy"],
  "Nựng / Chơi": ["Nựng", "Chơi cùng"],
  "Kỷ luật": ["Nhắc nhở", "Khen"],
  "Thông tin": ["Chỉ số", "Bộ đếm", "Đồng hồ", "Kết nối"]
};

let page = "home";
let index = 0;
let stack = [];
let opened = false;

function refresh() {
  panel.hidden = !opened;
  if (!opened) return;

  panel.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = page === "home" ? "MENU OHANA" : page;
  panel.append(heading);

  tree[page].forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "menu-row" + (i === index ? " active" : "");
    row.textContent = (i === index ? "▶ " : "  ") + name;
    panel.append(row);
  });

  panel.children[index + 1].scrollIntoView({ block: "nearest" });
}

function home() {
  touch();
  page = "home";
  index = 0;
  stack = [];
  opened = true;
  refresh();
}

function exit() {
  touch();
  opened = false;
  refresh();
}

function back() {
  touch();
  if (!opened) return;

  if (stack.length) {
    [page, index] = stack.pop();
    refresh();
  } else {
    exit();
  }
}

function move(step) {
  touch();

  if (!opened) {
    home();
  } else {
    index = (index + step + tree[page].length) % tree[page].length;
    refresh();
  }
}

function duration(milliseconds) {
  const minutes = Math.ceil(Math.max(0, milliseconds) / 60000);
  return Math.floor(minutes / 60) + "h " + minutes % 60 + "p";
}

function select() {
  touch();
  update();

  if (!opened) {
    home();
    return;
  }

  const name = tree[page][index];
  if ((pet.medicineDue || pet.cleaningDue) && !["Chỉ số","Tình trạng","Bộ đếm","Đồng hồ","Kết nối"].includes(name) && !tree[name]) {say("Chờ Stitch làm xong nhé."); return;}

  if (tree[name]) {
    stack.push([page, index]);
    page = name;
    index = 0;
    refresh();
    return;
  }

  if (["Cơm", "Trái cây", "Snack"].includes(name)) {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else if (hunger() < 15) {
      say("Stitch còn no, đừng cho ăn thêm nhé.");
    } else {
      pet.fed = Date.now();
      pet.digestion.push(
        Date.now() + (45 + Math.random() * 45) * 60000
      );
      state.meal = ["Cơm", "Trái cây", "Snack"].indexOf(name);
      animate(1);
      say("Măm măm! Độ đói sẽ tăng dần trong 9 giờ.");
    }

  } else if (name === "Dọn chất thải") {
    if (!pet.waste) {
      say("Chưa có chất thải để dọn.");
    } else {
      if(pet.sleep){say("Đánh thức Stitch trước nhé.");return;}
      pet.cleaningCount=pet.waste;pet.cleaningDue=Date.now()+5000;
      animate(8);
      say("Stitch đang quét dọn.");
    }

  } else if (name === "Uống thuốc") {
    if (!pet.sick) {
      say("Stitch khỏe, không cần uống thuốc.");
    } else {
      if(pet.sleep){say("Đánh thức Stitch trước nhé.");return;}
      pet.medicineDue=Date.now()+5000;
      animate(9);
      say("Stitch đang uống thuốc rồi uống nước.");
    }

  } else if (name === "Đi ngủ" || name === "Nghỉ ngơi") {
    pet.sleep = true;
    say("Ngủ hồi năng lượng. Chọn Thức dậy khi muốn.");

  } else if (name === "Thức dậy") {
    pet.sleep = false;
    say("Chào Ohana!");

  } else if (["Nựng", "Chơi cùng", "Khen"].includes(name)) {
    if (pet.sleep) {
      say("Stitch đang ngủ.");
    } else {
      pet.happy = Math.min(100, pet.happy + 15);
      if(name==="Chơi cùng" && (pet.sick||pet.energy<15)){say("Stitch cần nghỉ, chưa chạy được.");return;}
      animate(name==="Chơi cùng"?14:2,name==="Chơi cùng"?8:5);
      say("Ohana! Vui quá!");
    }

  } else if (name === "Nhắc nhở") {
    pet.discipline = Math.min(100, pet.discipline + 5);
    animate(10);
    say("Nhắc nhẹ thôi nhé!");

  } else if (name === "Bộ đếm") {
    say(
      "Đói hoàn toàn sau " +
      duration(pet.fed + 9 * HOUR - Date.now()) +
      " • Tiêu hóa: " +
      (pet.digestion.length
        ? duration(Math.min(...pet.digestion) - Date.now())
        : "chưa có")
    );

  } else if (name === "Chỉ số" || name === "Tình trạng") {
    say(
      "Đói " + Math.round(hunger()) +
      " • Vui " + Math.round(pet.happy) +
      " • Sức khỏe " + Math.round(pet.health) +
      " • Năng lượng " + Math.round(pet.energy) +
      " • Sạch " + Math.round(pet.clean) +
      " • Kỷ luật " + pet.discipline +
      " • Chất thải " + pet.waste +
      (pet.sick ? " • Đang ốm" : "")
    );

  } else if (name === "Đồng hồ") {
    say(new Date().toLocaleString("vi-VN"));

  } else {
    say("Chưa kết nối Adafruit / ESP32.");
  }

  updateHud();
  save();
  opened = false;
  refresh();
}

document.querySelectorAll("[data-step]").forEach(button => {
  button.onclick = () => move(Number(button.dataset.step));
});

document.getElementById("home").onclick = home;
document.getElementById("back").onclick = back;
document.getElementById("select").onclick = select;
document.getElementById("exit").onclick = exit;

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  const supported = [
    "arrowup", "arrowleft", "arrowdown", "arrowright",
    "enter", "escape", "h", "x"
  ];

  if (!supported.includes(key)) return;
  event.preventDefault();

  // Giữ SELECT không được xác nhận liên tiếp nhiều mục.
  if (event.repeat && ["enter", "h", "x", "escape"].includes(key)) {
    return;
  }

  if (key === "enter") select();
  else if (key === "escape") back();
  else if (key === "h") home();
  else if (key === "x") exit();
  else move(["arrowup", "arrowleft"].includes(key) ? -1 : 1);
});

/* Thời lượng hoạt động dùng đồng hồ thật. */
let lastFrame = "";
let lastUpdate = 0;

function loop(now) {
  if (now - lastUpdate > 1000) {
    update();
    lastUpdate = now;
  }

  const time = Date.now();
  const idle = time - lastInput;
  const hour = new Date().getHours();

  if (!opened && !end && !pet.medicineDue && !pet.cleaningDue && !pet.sleep && !pet.sick && pet.energy > 25) {
    if (idle >= 90000 && !idleDance) {
      idleDance = true;
      animate(11, 12);
      say("Stitch mặc váy lá nhảy Hawaii!");
    }

    if (idle >= 120000 && !idleCoconut) {
      idleCoconut = true;
      animate(12, 10);
      say("Gặm vỏ dừa cho vui — không tính là bữa ăn.");
    }
  }

  if (end && time > end) {
    temporary = 0;
    end = 0;
  }

  state.pose =
    pet.medicineDue ? 9 :
    pet.cleaningDue ? 8 :
    pet.sleep ? 4 :
    pet.sick ? 7 :
    end ? temporary :
    (hour >= 22 || hour < 6 || pet.energy < 25) ? 13 :
    0;

  const frame = Math.floor(now / 80) % 100000;
  const key = state.pose + ":" + frame + ":" + state.waste;

  if (key !== lastFrame) {
    render(state.pose, frame);
    lastFrame = key;
  }

  requestAnimationFrame(loop);
}

say("Ohana! HOME mở menu.");
update();
requestAnimationFrame(loop);
</script>
