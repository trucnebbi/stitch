<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch — Ohana Pocket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root {
  --shell-main: #269eea;
  --shell-light: #a5e4ff;
  --shell-dark: #135aa6;
  --border-dark: #141720;
  --screen-bezel: #7d83a8;
  --screen-bezel-dark: #585d7e;
  --screen-bg: #3b405c;
  --dpad-main: #868eb2;
  --dpad-light: #a5adc9;
  --dpad-dark: #616887;
  --btn-red: #d45567;
  --btn-red-light: #ec7888;
  --btn-red-dark: #9c3445;
  --speaker: #2a2f45;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px 12px;
  background:
    radial-gradient(circle at 20% 20%, #23283d, transparent 45%),
    radial-gradient(circle at 80% 80%, #1c323a, transparent 45%),
    #121520;
  font-family: "Press Start 2P", monospace;
  color: #f4f7ff;
}

.console {
  position: relative;
  width: 340px;
  max-width: 94vw;
  padding: 24px 24px 28px;
  background: var(--shell-main);
  border: 6px solid var(--border-dark);
  border-radius: 36px 36px 22px 22px;
  box-shadow:
    inset 0 8px 0 var(--shell-light),
    inset 0 -10px 0 var(--shell-dark),
    inset 8px 0 0 var(--shell-light),
    inset -8px 0 0 var(--shell-dark),
    0 18px 0 #0b0d14,
    0 26px 40px #0008;
  image-rendering: pixelated;
}

.bezel {
  padding: 12px;
  margin-bottom: 34px;
  background: var(--screen-bezel);
  border: 6px solid var(--border-dark);
  box-shadow:
    inset 4px 4px 0 #9aa0c4,
    inset -4px -4px 0 var(--screen-bezel-dark);
}

.screen-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 128 / 160;
  background: var(--screen-bg);
  border: 5px solid var(--border-dark);
  overflow: hidden;
  box-shadow: inset 0 0 24px #0a0c168c;
}

.screen-wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    #ffffff08 0 2px,
    transparent 2px 4px
  );
}

#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

.hud-bar {
  position: absolute;
  top: 5px;
  left: 5px;
  right: 5px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 9px;
  color: #ffd166;
  text-shadow: 2px 2px 0 var(--border-dark);
  pointer-events: none;
  z-index: 2;
}

.status-bars {
  display: grid;
  gap: 3px;
  width: 54%;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 3px;
}

.status-row svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  shape-rendering: crispEdges;
}

.status-track {
  height: 8px;
  flex: 1;
  background: #102437;
  border: 1px solid #b8d6e3;
  overflow: hidden;
}

.status-track i {
  display: block;
  height: 100%;
  width: 0;
}

#spiritFill { background: #ff789e; }
#hungerFill { background: #ffc56b; }

.menu-panel {
  position: absolute;
  inset: 0;
  padding: 10px;
  z-index: 5;
  overflow: auto;
  background: #18243bf5;
  font: 14px monospace;
}

.menu-panel[hidden] { display: none; }

.menu-panel h3 {
  margin: 0 0 10px;
  color: #ffd166;
}

.menu-row {
  padding: 7px 3px;
}

.menu-row.active {
  background: #a5e4ff;
  color: #141720;
}

.overlay-msg {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #22263ac7;
}

.overlay-msg.hidden { display: none; }

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.dpad {
  position: relative;
  width: 108px;
  height: 108px;
  flex-shrink: 0;
}

.dpad-btn {
  position: absolute;
  width: 36px;
  height: 36px;
  padding: 0;
  background: var(--dpad-main);
  border: 5px solid var(--border-dark);
  cursor: pointer;
  touch-action: manipulation;
  box-shadow:
    inset 3px 3px 0 var(--dpad-light),
    inset -3px -3px 0 var(--dpad-dark);
}

.dpad-up {
  top: 0;
  left: 36px;
  border-bottom: none;
}

.dpad-down {
  bottom: 0;
  left: 36px;
  border-top: none;
}

.dpad-left {
  top: 36px;
  left: 0;
  border-right: none;
}

.dpad-right {
  top: 36px;
  right: 0;
  border-left: none;
}

.dpad-center {
  position: absolute;
  top: 36px;
  left: 36px;
  width: 36px;
  height: 36px;
  background: var(--dpad-main);
  pointer-events: none;
}

.dpad-btn:active {
  transform: translateY(2px);
  background: var(--dpad-dark);
}

.action-pad {
  width: 120px;
  height: 130px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 0;
  flex-shrink: 0;
}

.round-btn {
  position: relative;
  width: 30px;
  height: 30px;
  margin: auto;
  padding: 0;
  border-radius: 50%;
  background: var(--btn-red);
  border: 5px solid var(--border-dark);
  cursor: pointer;
  touch-action: manipulation;
  box-shadow:
    inset 3px 3px 0 var(--btn-red-light),
    inset -3px -3px 0 var(--btn-red-dark);
}

.round-btn::after {
  content: attr(data-label);
  position: absolute;
  top: 32px;
  left: 50%;
  transform: translateX(-50%);
  font: 7px "Press Start 2P", monospace;
  color: #141720;
}

.round-btn:active {
  transform: scale(.94);
  background: var(--btn-red-dark);
}

button:focus-visible {
  outline: 3px solid #ffd166;
  outline-offset: 2px;
}

.speaker {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding-right: 14px;
  margin-top: 6px;
}

.speaker-slot {
  width: 14px;
  height: 44px;
  background: var(--speaker);
  border: 4px solid var(--border-dark);
  border-radius: 6px;
  box-shadow: inset 3px 0 0 #1b1e2e;
}

.footer-note {
  max-width: 420px;
  font-size: 9px;
  line-height: 1.8;
  text-align: center;
  color: #9ba5c9;
}
</style>
</head>

<body>
<main class="console" aria-label="Máy chăm Stitch màu xanh biển">
  <div class="bezel">
    <div class="screen-wrapper">
      <div class="hud-bar" aria-label="Đồng hồ và tình trạng Stitch">
        <span id="petClock">00:00</span>

        <div class="status-bars">
          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ff789e"
                d="M1 2h4v1h2V2h4v5H9v2H7v2H5V9H3V7H1z"
              />
            </svg>

            <div
              class="status-track"
              role="progressbar"
              aria-label="Tinh thần"
              aria-valuemin="0"
              aria-valuemax="100"
              id="spiritTrack"
            >
              <i id="spiritFill"></i>
            </div>
          </div>

          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ffc56b"
                d="M3 1h6v1h2v7H9v2H3V9H1V2h2z"
              />
              <path
                fill="#af7038"
                d="M4 4h1v1H4zm3 2h1v1H7zM3 8h1v1H3z"
              />
            </svg>

            <div
              class="status-track"
              role="progressbar"
              aria-label="Độ đói"
              aria-valuemin="0"
              aria-valuemax="100"
              id="hungerTrack"
            >
              <i id="hungerFill"></i>
            </div>
          </div>
        </div>
      </div>

      <section class="menu-panel" id="menuPanel" hidden></section>

      <canvas
        id="gameCanvas"
        width="128"
        height="160"
        aria-label="Stitch pixel"
      ></canvas>

      <div id="overlay" class="overlay-msg hidden">
        <div id="overlayTitle">STITCH</div>
        <div id="overlaySub">OHANA POCKET PET</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Phím điều hướng">
      <button class="dpad-btn dpad-up" data-dir="UP" aria-label="Lên"></button>
      <button class="dpad-btn dpad-down" data-dir="DOWN" aria-label="Xuống"></button>
      <button class="dpad-btn dpad-left" data-dir="LEFT" aria-label="Trái"></button>
      <button class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="Phải"></button>
      <div class="dpad-center"></div>
    </div>

    <div class="action-pad" role="group" aria-label="Nút hành động">
      <button data-label="HOME" class="round-btn btn-top" aria-label="HOME"></button>
      <button data-label="EXIT" class="round-btn btn-bottom" aria-label="EXIT"></button>
      <button data-label="BACK" class="round-btn btn-left" aria-label="BACK"></button>
      <button data-label="SELECT" class="round-btn btn-right" aria-label="SELECT"></button>
    </div>
  </div>

  <div class="speaker" aria-hidden="true">
    <div class="speaker-slot"></div>
    <div class="speaker-slot"></div>
    <div class="speaker-slot"></div>
  </div>
</main>

<p class="footer-note" aria-live="polite">
  DEMO • Chưa kết nối ESP32 / Adafruit
</p>

<script>
"use strict";

/* Sprite pixel gốc. */
const art = {
  palette: [
    0, 8452, 15218, 36411,
    38037, 2152, 65535, 63887
  ],

  glyph: [
    31725, 27566, 29255, 27502, 29639, 29636,
    29419, 23533, 29847, 4686, 23469, 18727,
    24557, 24429, 31599, 31716, 31611, 31661,
    29582, 29842, 23407, 23402, 23549, 23213,
    23186, 29351, 31599, 13463, 25255, 25294,
    23497, 29582, 29679, 29330, 31727, 31694,
    1040, 448, 2, 4772, 21157, 1488,
    5393, 17492, 25218, 0
  ],

  pixels: `
000000000000000000000000000000000000000000000
000000000000000000000000000000000001110000000
000000000000000000000000000000000001111000000
000000000000000000000000000000000001441100000
000000000000000000000000000000000001444110000
001111111000000000000000000000000001444411000
001111111000000000000000000000000001444441100
001444441000000000000000000000000001444444110
001444441000000000000000000000000001444444110
001444441000000000001110000000000001444444110
001444441000000000111111111100000001444444110
001444441000000011112222211111000001444444410
001444441000000112222222222221110001444444410
001444441000001122222222222222211001444444410
001444441000011222222222222222221101444444410
001444441000012332222222222233332101444444410
001444441000123333222222222233333111444444410
001444441001333333222222222233333311444444410
001444441112311333222222222233111311444444110
001444444113111133222222222231661131444410000
001144444111166113222222222231661111444410000
000144444131166113555555555231111111444410000
000114441111111113555555555531111111444410000
000014444111111113555555555531116111444110000
000011444111111113555555555533111111141110000
000011144111111133555555555533111131111100000
000000111111333333555555555533333310011000000
000000001111233333225555555233333100000000000
000000000001111222222555552222211000000000000
000000000000111111111111111111110000000000000
000000000000000022333333333321000000000000000
000000000000000112233333333321000000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322200000000000000
000000000000000212233333333322210000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322121000000000000
000000000000012221223333333322221100000000000
000000111111112221223333333222221100000000000
000000222211112221223333333221211111111000000
000001222221112222123333333221211122211110000
000012222222112222123333333221211122222111000
000012555522112222123333333212211122222211000
000012555522111222123333333212211122555521000
000012555522122122123333333212211122555521000
000011222222112111111111111211111122555521000
000011111111111111000000011111111111222211000
000000000000000000000000000000000011111110000
000000000000000000000000000000000000000000000
`.trim().split(/\s+/).map(row => Array.from(row, Number))
};

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const state = {
  pose: 0,
  meal: 0,
  waste: 0
};

function color(value) {
  const r = Math.round(((value >> 11) & 31) * 255 / 31);
  const g = Math.round(((value >> 5) & 63) * 255 / 63);
  const b = Math.round((value & 31) * 255 / 31);
  return `rgb(${r},${g},${b})`;
}

function rect(x, y, width, height, value) {
  ctx.fillStyle = color(value);
  ctx.fillRect(x, y, width, height);
}

function text(x, y, value, scale, c) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-./%+<>? ";

  for (const ch of value.toUpperCase()) {
    const bits = art.glyph[alphabet.indexOf(ch)] || 0;

    for (let j = 0; j < 5; j++) {
      for (let i = 0; i < 3; i++) {
        if (bits & (1 << (14 - j * 3 - i))) {
          rect(x + i * scale, y + j * scale, scale, scale, c);
        }
      }
    }

    x += 4 * scale;
  }
}

function ink(x, y, pose, frame) {
  let c = art.pixels[y][x];

  const eyes =
    (x >= 10 && x <= 16 && y >= 18 && y <= 25) ||
    (x >= 29 && x <= 34 && y >= 18 && y <= 25);

  if (eyes && [2, 3, 4, 7].includes(pose)) {
    const center = x < 20 ? 13 : 31;

    c = pose === 2
      ? (y === 21 + (Math.abs(x - center) > 1 ? 1 : 0) ? 1 : 3)
      : (y === 23 ? 1 : 3);
  }

  if (x >= 19 && x <= 27 && y >= 28 && y <= 29) {
    if (pose === 1) c = frame ? 7 : 1;
    if (pose === 2) c = y === 28 && x > 20 && x < 26 ? 7 : 1;
    if (pose === 7) c = y === 28 && x > 20 && x < 26 ? 1 : 2;
  }

  if (
    pose === 2 &&
    y === 26 &&
    ((x >= 12 && x <= 14) || (x >= 31 && x <= 33))
  ) {
    c = 7;
  }

  if (
    pose === 5 &&
    y === 19 &&
    ((x >= 13 && x <= 14) || (x >= 30 && x <= 31))
  ) {
    c = 6;
  }

  return c;
}

/*
  0: bình thường
  1: ăn
  2: nựng / vui
  3: chớp mắt
  4: ngủ
  7: ốm
  8: dọn
  9: uống thuốc
  10: kỷ luật
  11: Hawaii
  12: gặm vỏ dừa
  13: buồn ngủ
  14: chạy đuổi dừa
*/

let poseStarted = 0;
let renderedPose = -1;

const ease = value => {
  value = Math.max(0, Math.min(1, value));
  return value * value * (3 - 2 * value);
};

/* Mọi phần cơ thể dùng chung gốc và tỷ lệ. */
function spriteLayer(region, pose, angle = 0, dx = 0, dy = 0) {
  const [x0, y0, x1, y1, pivotX, pivotY] = region;

  ctx.save();

  ctx.translate(
    (pivotX - 23) * 1.72,
    (pivotY - 29) * 1.72
  );

  ctx.rotate(angle);

  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const c = ink(x, y, pose, 0);

      if (c) {
        rect(
          (x - pivotX) * 1.72,
          (y - pivotY) * 1.72,
          2,
          2,
          art.palette[c]
        );
      }
    }
  }

  ctx.restore();
}

function coconut(x, y, rotation = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  rect(-6, -6, 12, 12, 0x8200);
  rect(-4, -8, 8, 2, 0xb386);
  rect(-3, -4, 2, 2, 0x2104);
  rect(2, -2, 2, 2, 0x2104);
  rect(-1, 2, 2, 2, 0x2104);

  ctx.restore();
}

function render(pose, frame) {
  const now = performance.now();

  if (pose !== renderedPose) {
    renderedPose = pose;
    poseStarted = now;
  }

  const elapsed = (now - poseStarted) / 1000;
  const t = elapsed * 3.2;

  rect(0, 0, 128, 160, pose === 4 ? 0x0001 : 0x0843);
  rect(0, 137, 128, 1, 0x2152);

  let cx = 64;
  let cy = 98;
  let running = 0;

  /* Gối vẽ phía sau nhân vật. */
  if (pose === 4) {
    rect(9, 111, 31, 23, 0xbfff);
    rect(12, 114, 25, 17, 0xffff);
  }

  /* Dừa lăn sang phải, chạy ra phải và về từ trái. */
  if (pose === 14) {
    if (elapsed < 1) {
      coconut(
        88 + elapsed * 25,
        89 + elapsed * 40,
        elapsed * 5
      );
    } else if (elapsed < 3.7) {
      const u = (elapsed - 1) / 2.7;
      cx = 64 + u * 118;
      running = 1;
      coconut(cx + 42, 129, u * 20);
    } else if (elapsed < 4.3) {
      cx = 185;
      running = 1;
    } else {
      const u = Math.min(1, (elapsed - 4.3) / 3.2);
      cx = -48 + 112 * u;
      running = u < 1 ? 1 : 0;

      if (u < 1) {
        coconut(cx + 38, 129, u * 18);
      }
    }
  }

  if (pose === 11) {
    cx += Math.sin(t) * 2;
    cy -= Math.sin(t * 2) * 1.8;
  }

  if (pose === 2) {
    cy -= Math.abs(Math.sin(t)) * 7;
  }

  if (running) {
    cy -= Math.abs(Math.sin(elapsed * 14)) * 3;
  }

  if (pose === 7) {
    cy += 3;
  }

  rect(cx - 23, 135, 46, 2, 0x2104);

  ctx.save();
  ctx.translate(cx, cy);

  /* Nằm xuống bằng phép xoay, không ép bẹt sprite. */
  if (pose === 4) {
    const settle = ease(elapsed / 1.2);

    ctx.translate(
      0,
      (18 + Math.sin(t * .45)) * settle
    );

    ctx.rotate(-Math.PI / 2 * settle);
  }

  const swing = running
    ? Math.sin(elapsed * 14) * .65
    : pose === 11
      ? Math.sin(t) * .23
      : Math.sin(t) * .035;

  /* Thân và chân giữ màu, nét từ sprite gốc. */
  spriteLayer(
    [18, 31, 29, 49, 23, 34],
    pose,
    pose === 11 ? Math.sin(t) * .035 : 0,
    0,
    5
  );

  spriteLayer(
    [0, 40, 18, 51, 15, 42],
    pose,
    swing,
    -14,
    22
  );

  spriteLayer(
    [29, 40, 45, 51, 31, 42],
    pose,
    -swing,
    14,
    22
  );

  let leftArm = pose === 11
    ? -.65 + Math.sin(t) * .4
    : running ? -swing : 0;

  let rightArm = pose === 11
    ? .65 + Math.sin(t) * .4
    : running ? swing : 0;

  if (pose === 8) {
    rightArm = -.25 + Math.sin(t * 2) * .35;
  }

  if (pose === 9) {
    rightArm = 1.8 * ease(elapsed / 1.7);
  }

  if (pose === 1 || pose === 12) {
    leftArm = -.7;
  }

  spriteLayer(
    [14, 31, 18, 45, 16, 33],
    pose,
    leftArm,
    -10,
    5
  );

  spriteLayer(
    [29, 31, 33, 45, 31, 33],
    pose,
    rightArm,
    10,
    5
  );

  /* Đầu và phụ kiện trên mặt dùng cùng phép xoay. */
  const headPose =
    pose === 0 && Math.floor(elapsed * 10) % 45 === 0
      ? 3
      : pose;

  const headAngle = pose === 11
    ? Math.sin(t) * .055
    : pose === 7 ? .08 : 0;

  spriteLayer(
    [0, 0, 45, 31, 23, 29],
    headPose,
    headAngle
  );

  ctx.save();
  ctx.rotate(headAngle);

  /* Mắt lim dim, miệng ngáp có răng và lưỡi. */
  if (pose === 13) {
    rect(-23, -19, 13, 10, 0x8e3b);
    rect(10, -19, 11, 10, 0x8e3b);

    rect(-23, -11, 13, 2, 0x2104);
    rect(10, -11, 11, 2, 0x2104);

    const phase = elapsed % 8;

    const yawning = phase < 1
      ? ease(phase)
      : phase < 2.8
        ? 1
        : phase < 4
          ? 1 - ease((phase - 2.8) / 1.2)
          : 0;

    const jaw = 2 + Math.round(yawning * 10);

    rect(-7, -2, 15, jaw + 2, 0x2104);

    if (yawning > .15) {
      rect(-5, 0, 11, jaw - 1, 0x7808);
      rect(-3, jaw - 4, 7, 3, 0xf98f);
      rect(-5, 0, 2, 2, 0xffda);
      rect(4, 0, 2, 2, 0xffda);
    }
  }

  /* Bịt mắt ngủ. */
  if (pose === 4) {
    rect(-22, -19, 41, 3, 0x416c);
    rect(-23, -23, 20, 10, 0x99b8);
    rect(3, -23, 19, 10, 0x99b8);

    rect(-20, -22, 14, 2, 0xc4df);
    rect(6, -22, 13, 2, 0xc4df);
  }

  /* Miếng hạ sốt giữ lại khi đang ốm. */
  if (
    pose === 7 ||
    pose === 9 ||
    (pose === 4 && pet.sick)
  ) {
    rect(-10, -30, 22, 6, 0xbfff);
    rect(-8, -29, 18, 2, 0xffff);

    if (pose === 7) {
      rect(1, 0, 25, 2, 0xffff);
      rect(19, -1, 6, 4, 0xc618);
      rect(23, 0, 3, 2, 0xf800);
    }
  }

  ctx.restore();

  /* Váy lá ở eo và vòng lá trên trán. */
  if (pose === 11) {
    for (let i = 0; i < 8; i++) {
      rect(-17 + i * 4, 19, 4, 10 + i % 3, 0x5ca6);
      rect(-16 + i * 4, 20, 1, 7, 0x8ea8);
    }

    for (let i = 0; i < 6; i++) {
      rect(
        -16 + i * 6,
        -29 + Math.sin(t + i),
        5,
        4,
        0x5ca6
      );
    }
  }

  /* Chổi đi theo tay phải. */
  if (pose === 8) {
    ctx.save();

    ctx.translate(
      (31 - 23) * 1.72,
      (33 - 29) * 1.72
    );

    ctx.rotate(rightArm);

    rect(-1, 10, 2, 22, 0xb386);
    rect(-6, 29, 12, 5, 0xfd20);

    for (let i = 0; i < 5; i++) {
      rect(-5 + i * 2, 32, 1, 4, 0xb386);
    }

    ctx.restore();
  }

  /* Đưa thuốc lên, sau đó uống nước. */
  if (pose === 9) {
    ctx.save();

    ctx.translate(
      (31 - 23) * 1.72,
      (33 - 29) * 1.72
    );

    ctx.rotate(rightArm);

    if (elapsed < 2) {
      rect(-2, 15, 5, 3, 0xffff);
      rect(1, 15, 2, 3, 0xf800);
    } else {
      rect(-3, 12, 7, 10, 0x65ff);
      rect(-2, 13, 5, 2, 0xffff);
    }

    ctx.restore();
  }

  if (pose === 1) {
    rect(
      -7,
      4,
      13,
      7,
      [0xffff, 0x07e0, 0xfd20][state.meal] || 0xffff
    );
  }

  if (pose === 12) {
    coconut(0, 6, Math.sin(t) * .08);
  }

  ctx.restore();

  /* Chăn phủ sau khi Stitch nằm xuống. */
  if (pose === 4) {
    const cover = ease((elapsed - .3) / .9);
    const blanketY = 132 - 24 * cover + Math.sin(t * .45);

    rect(48, blanketY, 56, 24 * cover, 0x3b72);
    rect(48, blanketY, 56, 3, 0x65ff);

    for (let i = 0; i < 5; i++) {
      rect(52 + i * 10, 117, 3, 3, 0x8e3b);
    }
  }

  if (pose === 2) {
    for (let i = 0; i < 2; i++) {
      const x = 9 + i * 101;
      const y = 67 - (elapsed * 14 + i * 9) % 28;

      rect(x, y, 3, 3, 0xf98f);
      rect(x + 5, y, 3, 3, 0xf98f);
      rect(x, y + 3, 8, 3, 0xf98f);
      rect(x + 2, y + 6, 4, 2, 0xf98f);
    }
  }

  if (pose === 13) {
    text(97, 53, "ZZ?", 1, 0xffe0);
  }

  if (pose === 10) {
    text(103, 70, "!", 2, 0xffe0);
  }

  if (state.waste || (pose === 8 && elapsed < 3)) {
    rect(107, 130, 10, 4, 0x8200);
    rect(109, 127, 6, 3, 0x8200);
  }
}

/* Luật nuôi: lưu riêng trong trình duyệt. */
const KEY = "ohana-pet-v2";
const HOUR = 3600000;

let pet;

try {
  pet = JSON.parse(localStorage.getItem(KEY));
} catch (error) {}

if (!pet || pet.version !== 2) {
  pet = {
    version: 2,
    last: Date.now(),
    fed: Date.now(),
    happy: 80,
    energy: 85,
    clean: 100,
    health: 100,
    discipline: 70,
    waste: 0,
    digestion: [],
    sick: false,
    sleep: false,
    nextIll: Date.now() + 12 * HOUR + Math.random() * 12 * HOUR
  };
}

let lastInput = Date.now();
let idleDance = false;
let idleCoconut = false;
let temporary = 0;
let end = 0;

const note = document.querySelector(".footer-note");

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(pet));
  } catch (error) {}
}

function say(value) {
  note.textContent =
    value + " • Thú nuôi trên trình duyệt, chưa đồng bộ ESP32";
}

function touch() {
  lastInput = Date.now();
  idleDance = false;
  idleCoconut = false;
}

function animate(pose, seconds = 5) {
  renderedPose = -1;
  temporary = pose;
  end = Date.now() + seconds * 1000;
}

function hunger() {
  return Math.min(
    100,
    Math.max(0, (Date.now() - pet.fed) / (9 * HOUR) * 100)
  );
}

function updateHud() {
  const date = new Date();

  document.getElementById("petClock").textContent =
    String(date.getHours()).padStart(2, "0") + ":" +
    String(date.getMinutes()).padStart(2, "0");

  const spirit = Math.round(
    Math.max(0, Math.min(100, pet.happy))
  );

  const hungry = Math.round(hunger());

  document.getElementById("spiritFill").style.width =
    spirit + "%";

  document.getElementById("hungerFill").style.width =
    hungry + "%";

  document.getElementById("hungerFill").style.background =
    hungry >= 80 ? "#ff6565" : "#ffc56b";

  document.getElementById("spiritTrack").setAttribute(
    "aria-valuenow",
    spirit
  );

  document.getElementById("hungerTrack").setAttribute(
    "aria-valuenow",
    hungry
  );
}

function update() {
  const now = Date.now();
  const hours = Math.max(0, (now - pet.last) / HOUR);

  pet.last = now;

  pet.happy = Math.max(0, pet.happy - hours * 3);

  pet.energy = Math.max(
    0,
    Math.min(
      100,
      pet.energy + hours * (pet.sleep ? 15 : -4)
    )
  );

  pet.clean = Math.max(
    0,
    pet.clean - hours * (pet.waste ? 6 : 1)
  );

  pet.digestion = pet.digestion.filter(deadline => {
    if (deadline <= now) {
      pet.waste++;
      return false;
    }

    return true;
  });

  const neglected =
    pet.clean < 40 ||
    hunger() > 85 ||
    pet.energy < 20;

  if (now >= pet.nextIll) {
    if (neglected && Math.random() < .45) {
      pet.sick = true;
      say("Stitch thấy không khỏe, cần chăm sóc.");
    }

    pet.nextIll =
      now + 6 * HOUR + Math.random() * 6 * HOUR;
  }

  pet.health = Math.max(
    0,
    Math.min(
      100,
      pet.health + hours * (
        pet.sick ? -3 : pet.sleep ? 2 : 0
      )
    )
  );

  state.waste = pet.waste;

  updateHud();
  save();
}

/* Menu. */
const tree = {
  home: [
    "Cho ăn",
    "Sức khỏe",
    "Vệ sinh",
    "Ngủ",
    "Nựng / Chơi",
    "Kỷ luật",
    "Thông tin"
  ],

  "Cho ăn": ["Cơm", "Trái cây", "Snack"],
  "Sức khỏe": ["Nghỉ ngơi", "Uống thuốc", "Tình trạng"],
  "Vệ sinh": ["Dọn chất thải"],
  "Ngủ": ["Đi ngủ", "Thức dậy"],
  "Nựng / Chơi": ["Nựng", "Chơi cùng"],
  "Kỷ luật": ["Nhắc nhở", "Khen"],
  "Thông tin": ["Chỉ số", "Bộ đếm", "Đồng hồ", "Kết nối"]
};

let page = "home";
let index = 0;
let stack = [];
let opened = false;

const panel = document.getElementById("menuPanel");

function refresh() {
  panel.hidden = !opened;

  if (!opened) return;

  panel.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = page === "home" ? "MENU OHANA" : page;
  panel.append(heading);

  tree[page].forEach((name, i) => {
    const row = document.createElement("div");

    row.className =
      "menu-row" + (i === index ? " active" : "");

    row.textContent =
      (i === index ? "▶ " : "  ") + name;

    panel.append(row);
  });

  panel.children[index + 1].scrollIntoView({
    block: "nearest"
  });
}

function home() {
  touch();
  page = "home";
  index = 0;
  stack = [];
  opened = true;
  refresh();
}

function exit() {
  touch();
  opened = false;
  refresh();
}

function back() {
  touch();

  if (!opened) return;

  if (stack.length) {
    [page, index] = stack.pop();
    refresh();
  } else {
    exit();
  }
}

function move(step) {
  touch();

  if (!opened) {
    home();
  } else {
    index =
      (index + step + tree[page].length) % tree[page].length;

    refresh();
  }
}

function duration(milliseconds) {
  const minutes =
    Math.ceil(Math.max(0, milliseconds) / 60000);

  return Math.floor(minutes / 60) +
    "h " + minutes % 60 + "p";
}

function select() {
  touch();
  update();

  if (!opened) {
    home();
    return;
  }

  /* Không cho hành động khác chen ngang thuốc hoặc dọn. */
  if (pet.medicineDue || pet.cleaningDue) {
    say("Chờ Stitch làm xong nhé.");
    return;
  }

  const name = tree[page][index];

  if (tree[name]) {
    stack.push([page, index]);
    page = name;
    index = 0;
    refresh();
    return;
  }

  if (["Cơm", "Trái cây", "Snack"].includes(name)) {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else if (hunger() < 15) {
      say("Stitch còn no, đừng cho ăn thêm nhé.");
    } else {
      pet.fed = Date.now();

      pet.digestion.push(
        Date.now() + (45 + Math.random() * 45) * 60000
      );

      state.meal =
        ["Cơm", "Trái cây", "Snack"].indexOf(name);

      animate(1);

      say("Măm măm! No dần giảm trong 9 giờ.");
    }

  } else if (name === "Dọn chất thải") {
    if (!pet.waste) {
      say("Chưa có chất thải để dọn.");
    } else if (pet.sleep) {
      say("Đánh thức Stitch trước nhé.");
    } else {
      pet.cleaningDue = Date.now() + 5000;
      pet.cleaningCount = pet.waste;
      animate(8);
      say("Stitch đang quét dọn.");
    }

  } else if (name === "Uống thuốc") {
    if (!pet.sick) {
      say("Stitch khỏe, không cần uống thuốc.");
    } else if (pet.sleep) {
      say("Đánh thức Stitch trước khi uống thuốc nhé.");
    } else {
      pet.medicineDue = Date.now() + 5000;
      animate(9);
      say("Stitch đang uống thuốc…");
    }

  } else if (name === "Đi ngủ" || name === "Nghỉ ngơi") {
    pet.sleep = true;
    say("Ngủ hồi năng lượng. Chọn Thức dậy khi muốn.");

  } else if (name === "Thức dậy") {
    pet.sleep = false;
    say("Chào Ohana!");

  } else if (["Nựng", "Chơi cùng", "Khen"].includes(name)) {
    if (pet.sleep) {
      say("Stitch đang ngủ.");
    } else if (pet.sick && name === "Chơi cùng") {
      say("Stitch đang ốm, cần uống thuốc và nghỉ.");
    } else {
      pet.happy = Math.min(100, pet.happy + 15);

      animate(
        name === "Chơi cùng" ? 14 : 2,
        name === "Chơi cùng" ? 8 : 5
      );

      say("Ohana! Vui quá!");
    }

  } else if (name === "Nhắc nhở") {
    pet.discipline = Math.min(100, pet.discipline + 5);
    animate(10);
    say("Nhắc nhẹ thôi nhé!");

  } else if (name === "Bộ đếm") {
    say(
      "Đói hoàn toàn sau " +
      duration(pet.fed + 9 * HOUR - Date.now()) +
      " • Tiêu hóa: " +
      (
        pet.digestion.length
          ? duration(Math.min(...pet.digestion) - Date.now())
          : "chưa có"
      ) +
      " • Rảnh: " +
      Math.floor((Date.now() - lastInput) / 1000) +
      " giây"
    );

  } else if (name === "Chỉ số" || name === "Tình trạng") {
    say(
      "Đói " + Math.round(hunger()) +
      " • Vui " + Math.round(pet.happy) +
      " • Sức khỏe " + Math.round(pet.health) +
      " • Năng lượng " + Math.round(pet.energy) +
      " • Sạch " + Math.round(pet.clean) +
      " • Kỷ luật " + pet.discipline +
      " • Chất thải " + pet.waste +
      (pet.sick ? " • Đang ốm" : "")
    );

  } else if (name === "Đồng hồ") {
    say(new Date().toLocaleString("vi-VN"));

  } else {
    say("Chưa kết nối Adafruit / ESP32.");
  }

  updateHud();
  save();

  opened = false;
  refresh();
}

/* Nút trên màn hình. */
document.querySelectorAll(".dpad-btn").forEach(button => {
  button.onclick = () => move(
    ["UP", "LEFT"].includes(button.dataset.dir) ? -1 : 1
  );
});

document.querySelector(".btn-top").onclick = home;
document.querySelector(".btn-left").onclick = back;
document.querySelector(".btn-right").onclick = select;
document.querySelector(".btn-bottom").onclick = exit;

/* Bàn phím: giữ Enter không xác nhận nhiều lần. */
document.addEventListener("keydown", event => {
  const supported = [
    "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight",
    "Enter", "Escape", "h", "x"
  ];

  if (!supported.includes(event.key)) return;

  event.preventDefault();

  if (
    event.repeat &&
    ["Enter", "Escape", "h", "x"].includes(event.key)
  ) {
    return;
  }

  if (event.key === "Enter") {
    select();
  } else if (event.key === "Escape") {
    back();
  } else if (event.key === "h") {
    home();
  } else if (event.key === "x") {
    exit();
  } else {
    move(
      ["ArrowUp", "ArrowLeft"].includes(event.key) ? -1 : 1
    );
  }
});

/* Vòng chạy: chỉ vẽ khi frame hoặc trạng thái đổi. */
let lastFrame = "";
let lastUpdate = 0;

function loop(now) {
  if (now - lastUpdate > 1000) {
    update();
    lastUpdate = now;
  }

  const time = Date.now();
  const idle = time - lastInput;
  const hour = new Date().getHours();

  if (
    !opened &&
    !end &&
    !pet.sleep &&
    !pet.sick &&
    pet.energy > 25
  ) {
    if (idle >= 90000 && !idleDance) {
      idleDance = true;
      animate(11, 12);
      say("Stitch mặc váy lá nhảy Hawaii!");
    }

    if (idle >= 120000 && !idleCoconut) {
      idleCoconut = true;
      animate(12, 10);
      say("Gặm vỏ dừa cho vui — không tính là bữa ăn.");
    }
  }

  /* Chỉ trừ chất thải sau khi dọn hoàn tất. */
  if (pet.cleaningDue && time >= pet.cleaningDue) {
    pet.waste = Math.max(
      0,
      pet.waste - pet.cleaningCount
    );

    pet.cleaningDue = 0;
    pet.cleaningCount = 0;
    pet.clean = Math.min(100, pet.clean + 25);

    state.waste = pet.waste;

    save();
    say("Đã dọn xong.");
  }

  /* Chỉ khỏi ốm sau khi uống thuốc hoàn tất. */
  if (pet.medicineDue && time >= pet.medicineDue) {
    pet.medicineDue = 0;
    pet.sick = false;
    pet.health = Math.min(100, pet.health + 25);

    save();
    say("Đỡ rồi, vẫn cần nghỉ ngơi nhé.");
  }

  if (end && time > end) {
    temporary = 0;
    end = 0;
  }

  state.pose =
    end && [8, 9].includes(temporary) ? temporary :
    pet.sleep ? 4 :
    pet.sick ? 7 :
    end ? temporary :
    (hour >= 22 || hour < 6 || pet.energy < 25) ? 13 :
    0;

  const frame = Math.floor(now / 33) % 120;
  const key = state.pose + ":" + frame + ":" + state.waste;

  if (key !== lastFrame) {
    render(state.pose, frame);
    lastFrame = key;
  }

  requestAnimationFrame(loop);
}

say("Ohana! HOME mở menu.");
update();
requestAnimationFrame(loop);
</script>
