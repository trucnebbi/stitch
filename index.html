<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch — Ohana Pocket</title>
<style>
:root {
  --shell:#269eea;
  --light:#a5e4ff;
  --dark:#135aa6;
  --border:#141720;
}
* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body {
  margin:0;
  min-height:100vh;
  padding:24px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  background:
    radial-gradient(circle at 20% 20%,#23283d,transparent 45%),
    radial-gradient(circle at 80% 80%,#1c323a,transparent 45%),
    #121520;
  color:#eef5ff;
  font-family:monospace;
}
.console {
  width:340px;
  max-width:94vw;
  padding:24px;
  background:var(--shell);
  border:6px solid var(--border);
  border-radius:36px 36px 22px 22px;
  box-shadow:
    inset 8px 8px var(--light),
    inset -8px -10px var(--dark),
    0 18px #0b0d14,
    0 26px 40px #0008;
}
.brand {
  margin-bottom:18px;
  text-align:center;
  color:var(--border);
  font:bold 12px monospace;
  letter-spacing:2px;
}
.bezel {
  padding:12px;
  background:#7d83a8;
  border:6px solid var(--border);
  box-shadow:inset 4px 4px #a5adc9,inset -4px -4px #585d7e;
}
.screen {
  position:relative;
  aspect-ratio:128 / 160;
  overflow:hidden;
  background:#084358;
  border:5px solid var(--border);
}
canvas {
  display:block;
  width:100%;
  height:100%;
  image-rendering:pixelated;
}
.screen::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,#ffffff06 0 2px,transparent 2px 4px
  );
}
.hud {
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:5px;
  padding:6px 5px;
  pointer-events:none;
}
.clock {
  padding-top:3px;
  color:#ffd166;
  font:bold 12px monospace;
  white-space:nowrap;
}
.status-bars {
  display:grid;
  gap:4px;
  width:58%;
}
.status-row {
  display:flex;
  align-items:center;
  gap:4px;
  height:12px;
}
.status-row svg {
  width:12px;
  height:12px;
  flex-shrink:0;
  shape-rendering:crispEdges;
}
.track {
  flex:1;
  height:8px;
  border:1px solid #bddce8;
  background:#102437;
  overflow:hidden;
}
.fill {
  display:block;
  height:100%;
  width:0;
}
#spiritFill { background:#ff789e; }
#hungerFill { background:#ffc56b; }
.menu {
  position:absolute;
  inset:0;
  z-index:3;
  padding:10px;
  overflow:auto;
  background:#18243bf5;
  font:14px monospace;
}
.menu[hidden] { display:none; }
.menu h3 {
  margin:0 0 10px;
  color:#ffd166;
  font-size:15px;
}
.menu-row {
  padding:7px 3px;
  line-height:1.3;
}
.menu-row.active {
  background:var(--light);
  color:var(--border);
}
.controls {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:28px;
}
.dpad {
  position:relative;
  width:108px;
  height:108px;
  flex-shrink:0;
}
.dpad button {
  position:absolute;
  width:36px;
  height:36px;
  padding:0;
  color:var(--border);
  background:#868eb2;
  border:5px solid var(--border);
  box-shadow:inset 3px 3px #a5adc9,inset -3px -3px #616887;
}
.up { top:0;left:36px;border-bottom:none!important; }
.down { bottom:0;left:36px;border-top:none!important; }
.left { top:36px;left:0;border-right:none!important; }
.right { top:36px;right:0;border-left:none!important; }
.center {
  position:absolute;
  top:36px;
  left:36px;
  width:36px;
  height:36px;
  background:#868eb2;
  pointer-events:none;
}
.actions {
  display:grid;
  grid-template-columns:repeat(2,58px);
  gap:20px 2px;
  text-align:center;
}
.actions button {
  display:block;
  width:30px;
  height:30px;
  margin:auto;
  padding:0;
  border-radius:50%;
  background:#d45567;
  border:5px solid var(--border);
  box-shadow:inset 3px 3px #ec7888,inset -3px -3px #9c3445;
}
.actions span {
  display:block;
  margin-top:8px;
  color:var(--border);
  font:bold 9px monospace;
}
button { cursor:pointer;touch-action:manipulation; }
button:active { filter:brightness(.8);transform:translateY(2px); }
button:focus-visible { outline:3px solid #ffd166;outline-offset:2px; }
.speaker {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
}
.speaker i {
  width:14px;
  height:44px;
  border:4px solid var(--border);
  border-radius:6px;
  background:#2a2f45;
}
footer {
  max-width:440px;
  text-align:center;
  color:#adbbd4;
  font-size:12px;
  line-height:1.8;
}
#message { margin-bottom:8px;color:#ffd166; }
</style>
</head>
<body>
<main class="console">
  <div class="brand">OHANA POCKET PET</div>
  <div class="bezel">
    <div class="screen">
      <canvas id="petCanvas" width="128" height="160"
        aria-label="Stitch pixel"></canvas>

      <div class="hud">
        <time class="clock" id="petClock">00:00</time>
        <div class="status-bars">
          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path fill="#ff789e"
                d="M1 2h4v1h2V2h4v5H9v2H7v2H5V9H3V7H1z"/>
              <path fill="#ffd1e0" d="M2 3h2v1H2z"/>
            </svg>
            <div class="track" id="spiritTrack"
              role="progressbar" aria-label="Tinh thần"
              aria-valuemin="0" aria-valuemax="100">
              <i class="fill" id="spiritFill"></i>
            </div>
          </div>
          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path fill="#ffc56b"
                d="M3 1h6v1h2v7H9v2H3V9H1V2h2z"/>
              <path fill="#995c2d"
                d="M4 3h2v2H4zM8 5h1v2H8zM3 7h2v2H3z"/>
            </svg>
            <div class="track" id="hungerTrack"
              role="progressbar" aria-label="Độ đói"
              aria-valuemin="0" aria-valuemax="100">
              <i class="fill" id="hungerFill"></i>
            </div>
          </div>
        </div>
      </div>

      <section id="menu" class="menu" hidden></section>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Chọn mục menu">
      <button class="up" data-step="-1" aria-label="Lên">▲</button>
      <button class="left" data-step="-1" aria-label="Trái">◀</button>
      <div class="center"></div>
      <button class="right" data-step="1" aria-label="Phải">▶</button>
      <button class="down" data-step="1" aria-label="Xuống">▼</button>
    </div>

    <div class="actions">
      <div><button id="home" aria-label="Home"></button><span>HOME</span></div>
      <div><button id="back" aria-label="Back"></button><span>BACK</span></div>
      <div><button id="select" aria-label="Select"></button><span>SELECT</span></div>
      <div><button id="exit" aria-label="Exit"></button><span>EXIT</span></div>
    </div>
  </div>

  <div class="speaker" aria-hidden="true"><i></i><i></i><i></i></div>
</main>

<footer>
  <div id="message" aria-live="polite"></div>
  Thú nuôi trên trình duyệt • Chưa đồng bộ ESP32 / Adafruit<br>
  Phím hướng: chọn · Enter: xác nhận · Esc: quay lại<br>
  H: HOME · X: EXIT
</footer>

<script>
"use strict";

const palette = [
  0,8452,15218,36411,38037,2152,65535,63887
];

const pixels = `
000000000000000000000000000000000000000000000
000000000000000000000000000000000001110000000
000000000000000000000000000000000001111000000
000000000000000000000000000000000001441100000
000000000000000000000000000000000001444110000
001111111000000000000000000000000001444411000
001111111000000000000000000000000001444441100
001444441000000000000000000000000001444444110
001444441000000000000000000000000001444444110
001444441000000000001110000000000001444444110
001444441000000000111111111100000001444444110
001444441000000011112222211111000001444444410
001444441000000112222222222221110001444444410
001444441000001122222222222222211001444444410
001444441000011222222222222222221101444444410
001444441000012332222222222233332101444444410
001444441000123333222222222233333111444444410
001444441001333333222222222233333311444444410
001444441112311333222222222233111311444444110
001444444113111133222222222231661131444410000
001144444111166113222222222231661111444410000
000144444131166113555555555231111111444410000
000114441111111113555555555531111111444410000
000014444111111113555555555531116111444110000
000011444111111113555555555533111111141110000
000011144111111133555555555533111131111100000
000000111111333333555555555533333310011000000
000000001111233333225555555233333100000000000
000000000001111222222555552222211000000000000
000000000000111111111111111111110000000000000
000000000000000022333333333321000000000000000
000000000000000112233333333321000000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322200000000000000
000000000000000212233333333322210000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322121000000000000
000000000000012221223333333322221100000000000
000000111111112221223333333222221100000000000
000000222211112221223333333221211111111000000
000001222221112222123333333221211122211110000
000012222222112222123333333221211122222111000
000012555522112222123333333212211122222211000
000012555522111222123333333212211122555521000
000012555522122122123333333212211122555521000
000011222222112111111111111211111122555521000
000011111111111111000000011111111111222211000
000000000000000000000000000000000011111110000
000000000000000000000000000000000000000000000
`.trim().split(/\s+/).map(row => Array.from(row, Number));

const canvas = document.getElementById("petCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const panel = document.getElementById("menu");
const message = document.getElementById("message");
const state = { pose:0, meal:0, waste:0 };

function color(v) {
  return `rgb(${
    Math.round(((v >> 11) & 31) * 255 / 31)
  },${
    Math.round(((v >> 5) & 63) * 255 / 63)
  },${
    Math.round((v & 31) * 255 / 31)
  })`;
}

function rect(x,y,w,h,c) {
  ctx.fillStyle = color(c);
  ctx.fillRect(x,y,w,h);
}

function text(x,y,value,c = 0xffff,size = 8) {
  ctx.fillStyle = color(c);
  ctx.font = size + "px monospace";
  ctx.fillText(value,x,y);
}

function ease(u) {
  u = Math.max(0,Math.min(1,u));
  return u*u*(3-2*u);
}

function ink(x,y,pose,frame) {
  let c = pixels[y][x];
  const eyes =
    (x >= 10 && x <= 16 && y >= 18 && y <= 25) ||
    (x >= 29 && x <= 34 && y >= 18 && y <= 25);

  if (eyes && [2,3,4,7].includes(pose)) {
    const center = x < 20 ? 13 : 31;
    c = pose === 2
      ? (y === 21 + (Math.abs(x-center)>1 ? 1 : 0) ? 1 : 3)
      : (y === 23 ? 1 : 3);
  }

  if (x >= 19 && x <= 27 && y >= 28 && y <= 29) {
    if (pose === 1) c = frame ? 7 : 1;
    if (pose === 2) c = y === 28 && x > 20 && x < 26 ? 7 : 1;
    if (pose === 7) c = y === 28 && x > 20 && x < 26 ? 1 : 2;
  }

  if (pose === 2 && y === 26 &&
      ((x >= 12 && x <= 14) || (x >= 31 && x <= 33))) {
    c = 7;
  }

  return c;
}

/* Tách đầu, thân, tay và chân từ sprite gốc. */
function spriteLayer(region,pose,angle = 0,dx = 0,dy = 0) {
  const [x0,y0,x1,y1,px,py] = region;

  ctx.save();
  ctx.translate(px+dx,py+dy);
  ctx.rotate(angle);

  for (let y=y0;y<y1;y++) {
    for (let x=x0;x<x1;x++) {
      const c = ink(x,y,pose,0);
      if (c) rect((x-px)*1.72,(y-py)*1.72,2,2,palette[c]);
    }
  }

  ctx.restore();
}

function coconut(x,y,rotation = 0) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);
  rect(-6,-6,12,12,0x8200);
  rect(-4,-8,8,2,0xb386);
  rect(-3,-4,2,2,0x2104);
  rect(2,-2,2,2,0x2104);
  rect(-1,2,2,2,0x2104);
  ctx.restore();
}

function heart(x,y) {
  rect(x,y,3,3,0xf98f);
  rect(x+5,y,3,3,0xf98f);
  rect(x,y+3,8,3,0xf98f);
  rect(x+2,y+6,4,2,0xf98f);
}

let poseStarted = 0;
let renderedPose = -1;

/*
  0 bình thường; 1 ăn; 2 vui; 3 chớp mắt; 4 ngủ;
  7 ốm; 8 dọn; 9 thuốc; 10 kỷ luật;
  11 Hawaii; 12 gặm dừa; 13 buồn ngủ; 14 đuổi dừa.
*/
function render(pose,frame) {
  const now = performance.now();

  if (pose !== renderedPose) {
    renderedPose = pose;
    poseStarted = now;
  }

  const elapsed = (now-poseStarted)/1000;
  const t = elapsed*3.2;

  rect(0,0,128,160,pose === 4 ? 0x0001 : 0x0843);
  rect(0,137,128,1,0x2152);

  let cx = 64;
  let cy = 98;
  let run = 0;

  if (pose === 4) {
    rect(9,111,31,23,0xbfff);
    rect(12,114,25,17,0xffff);
  }

  if (pose === 14) {
    if (elapsed < 1) {
      coconut(88+elapsed*25,89+elapsed*40,elapsed*5);
    } else if (elapsed < 3.7) {
      const u = (elapsed-1)/2.7;
      cx = 64+u*118;
      run = 1;
      coconut(cx+42,129,u*20);
    } else if (elapsed < 4.3) {
      cx = 185;
      run = 1;
    } else {
      const u = Math.min(1,(elapsed-4.3)/3.2);
      cx = -48+112*u;
      run = u < 1 ? 1 : 0;
      if (u < 1) coconut(cx+38,129,u*18);
    }
  }

  if (pose === 11) {
    cx += Math.sin(t)*2;
    cy -= Math.sin(t*2)*1.8;
  }
  if (pose === 2) cy -= Math.abs(Math.sin(t))*7;
  if (run) cy -= Math.abs(Math.sin(elapsed*14))*3;
  if (pose === 7) cy += 3;

  rect(cx-23,135,46,2,0x2104);

  ctx.save();
  ctx.translate(cx,cy);

  if (pose === 4) {
    const settle = ease(elapsed/1.2);
    ctx.translate(0,(18+Math.sin(t*.45))*settle);
    ctx.rotate(-Math.PI/2*settle);
  }

  const swing = run
    ? Math.sin(elapsed*14)*.65
    : pose === 11
      ? Math.sin(t)*.23
      : Math.sin(t)*.035;

  spriteLayer(
    [18,30,29,47,23,34],
    pose,pose === 11 ? Math.sin(t)*.035 : 0,0,5
  );
  spriteLayer([6,40,18,50,15,42],pose,swing,-14,22);
  spriteLayer([29,40,40,50,31,42],pose,-swing,14,22);

  let left = pose === 11
    ? -.65+Math.sin(t)*.4
    : run ? -swing : 0;

  let right = pose === 11
    ? .65+Math.sin(t)*.4
    : run ? swing : 0;

  if (pose === 8) right = -.25+Math.sin(t*2)*.35;
  if (pose === 9) right = -.5-ease(elapsed/1.7)*.9;
  if (pose === 1 || pose === 12) left = -.7;

  spriteLayer([14,31,18,45,16,33],pose,left,-10,5);
  spriteLayer([29,31,33,45,31,33],pose,right,10,5);

  const headPose =
    pose === 0 && Math.floor(elapsed*10)%45 === 0 ? 3 : pose;

  spriteLayer(
    [0,0,45,31,23,29],
    headPose,
    pose === 11 ? Math.sin(t)*.055 : pose === 7 ? .08 : 0,
    0,0
  );

  /* Mắt lim dim và ngáp chậm theo chu kỳ 8 giây. */
  if (pose === 13) {
    rect(-22,-20,15,7,0x8e3b);
    rect(11,-20,12,7,0x8e3b);
    rect(-22,-14,15,2,0x2104);
    rect(11,-14,12,2,0x2104);

    const phase = elapsed%8;
    const opening =
      phase < 1 ? ease(phase) :
      phase < 3 ? 1 :
      phase < 4 ? 1-ease(phase-3) : 0;

    const jaw = 2+Math.round(opening*13);

    rect(-12,-2,26,jaw+4,0x2104);
    rect(-10,0,22,jaw,0x7808);

    if (opening > .15) {
      rect(-6,jaw-4,15,4,0xf98f);
      rect(-3,jaw-5,9,1,0xfc18);

      for (let i=0;i<5;i++) {
        rect(-9+i*5,0,3,3,0xffda);
        rect(-8+i*5,3,1,1,0xffda);
        rect(-8+i*5,jaw-2,3,2,0xffda);
      }
    }
  }

  if (pose === 4) {
    rect(-22,-19,41,3,0x416c);
    rect(-23,-23,20,10,0x99b8);
    rect(3,-23,19,10,0x99b8);
    rect(-20,-22,14,2,0xc4df);
    rect(6,-22,13,2,0xc4df);
  }

  if (pose === 7 || pose === 9 || (pose === 4 && pet.sick)) {
    rect(-10,-36,22,6,0xbfff);
    rect(-8,-35,18,2,0xffff);

    if (pose === 7) {
      rect(1,0,25,2,0xffff);
      rect(19,-1,6,4,0xc618);
      rect(23,0,3,2,0xf800);
    }
  }

  if (pose === 11) {
    for (let i=0;i<8;i++) {
      rect(-22+i*6,23,5,9+i%3,0x5ca6);
      rect(-21+i*6,24,1,6,0x8ea8);
    }
    for (let i=0;i<6;i++) {
      rect(-19+i*7,-45+Math.sin(t+i)*2,5,5,0x5ca6);
    }
  }

  if (pose === 8) {
    ctx.save();
    ctx.translate(13,7);
    ctx.rotate(right);
    rect(-1,10,2,22,0xb386);
    rect(-6,29,12,5,0xfd20);

    for (let i=0;i<5;i++) {
      rect(-5+i*2,32,1,4,0xb386);
    }
    ctx.restore();
  }

  if (pose === 9) {
    const lift = ease(elapsed/1.7);
    const px = 22-lift*18;
    const py = 20-lift*20;

    if (elapsed < 2) {
      rect(px,py,5,3,0xffff);
      rect(px+3,py,2,3,0xf800);
    }
    if (elapsed > 2) {
      rect(9,-2,7,9,0x65ff);
      rect(10,-1,5,2,0xffff);
    }
  }

  if (pose === 1) {
    rect(-7,4,13,7,[0xffff,0x07e0,0xfd20][state.meal]);
  }
  if (pose === 12) coconut(0,6,Math.sin(t)*.08);

  ctx.restore();

  if (pose === 4) {
    const cover = ease((elapsed-.3)/.9);
    const blanketY = 132-24*cover+Math.sin(t*.45);

    rect(48,blanketY,56,24*cover,0x3b72);
    rect(48,blanketY,56,3,0x65ff);

    for (let i=0;i<5;i++) {
      rect(52+i*10,117,3,3,0x8e3b);
    }
  }

  if (pose === 2) {
    for (let i=0;i<2;i++) {
      heart(9+i*101,67-(elapsed*14+i*9)%28);
    }
  }

  if (pose === 13) text(97,53,"ZZ?",0xffe0);
  if (pose === 10) text(103,70,"!",0xffe0,12);

  if (state.waste || (pose === 8 && elapsed < 3)) {
    rect(107,130,10,4,0x8200);
    rect(109,127,6,3,0x8200);
  }
}

/* Luật nuôi: giữ cùng khóa lưu của bản cũ. */
const KEY = "ohana-pet-v2";
const HOUR = 3600000;
let pet;

try {
  pet = JSON.parse(localStorage.getItem(KEY));
} catch (error) {}

if (!pet || pet.version !== 2) {
  pet = {
    version:2,
    last:Date.now(),
    fed:Date.now(),
    happy:80,
    energy:85,
    clean:100,
    health:100,
    discipline:70,
    waste:0,
    digestion:[],
    sick:false,
    sleep:false,
    nextIll:Date.now()+12*HOUR+Math.random()*12*HOUR
  };
}

let lastInput = Date.now();
let idleDance = false;
let idleCoconut = false;
let temporary = 0;
let end = 0;

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(pet));
  } catch (error) {}
}

function say(value) {
  message.textContent = value;
}

function touch() {
  lastInput = Date.now();
  idleDance = false;
  idleCoconut = false;
}

function animate(pose,seconds = 5) {
  temporary = pose;
  end = Date.now()+seconds*1000;
}

function hunger() {
  return Math.min(
    100,Math.max(0,(Date.now()-pet.fed)/(9*HOUR)*100)
  );
}

let previousHud = "";

function updateHud() {
  const now = new Date();
  const clock =
    String(now.getHours()).padStart(2,"0")+":"+
    String(now.getMinutes()).padStart(2,"0");

  const spirit = Math.round(Math.max(0,Math.min(100,pet.happy)));
  const hungry = Math.round(hunger());
  const key = clock+":"+spirit+":"+hungry;

  if (key === previousHud) return;
  previousHud = key;

  document.getElementById("petClock").textContent = clock;
  document.getElementById("spiritFill").style.width = spirit+"%";
  document.getElementById("hungerFill").style.width = hungry+"%";
  document.getElementById("hungerFill").style.background =
    hungry >= 80 ? "#ff6565" : "#ffc56b";

  document.getElementById("spiritTrack")
    .setAttribute("aria-valuenow",spirit);
  document.getElementById("hungerTrack")
    .setAttribute("aria-valuenow",hungry);
}

function update() {
  const now = Date.now();
  const hours = Math.max(0,(now-pet.last)/HOUR);

  pet.last = now;
  pet.happy = Math.max(0,pet.happy-hours*3);
  pet.energy = Math.max(
    0,Math.min(100,pet.energy+hours*(pet.sleep ? 15 : -4))
  );
  pet.clean = Math.max(
    0,pet.clean-hours*(pet.waste ? 6 : 1)
  );

  pet.digestion = pet.digestion.filter(deadline => {
    if (deadline <= now) {
      pet.waste++;
      return false;
    }
    return true;
  });

  const neglected =
    pet.clean < 40 || hunger() > 85 || pet.energy < 20;

  if (now >= pet.nextIll) {
    if (neglected && Math.random() < .45) {
      pet.sick = true;
      say("Stitch thấy không khỏe, cần chăm sóc.");
    }
    pet.nextIll = now+6*HOUR+Math.random()*6*HOUR;
  }

  pet.health = Math.max(
    0,Math.min(
      100,pet.health+hours*(pet.sick ? -3 : pet.sleep ? 2 : 0)
    )
  );

  state.waste = pet.waste;
  updateHud();
  save();
}

/* Cần gạt chỉ chọn, SELECT mới xác nhận. */
const tree = {
  home:[
    "Cho ăn","Sức khỏe","Vệ sinh","Ngủ",
    "Nựng / Chơi","Kỷ luật","Thông tin"
  ],
  "Cho ăn":["Cơm","Trái cây","Snack"],
  "Sức khỏe":["Nghỉ ngơi","Uống thuốc","Tình trạng"],
  "Vệ sinh":["Dọn chất thải"],
  "Ngủ":["Đi ngủ","Thức dậy"],
  "Nựng / Chơi":["Nựng","Chơi cùng"],
  "Kỷ luật":["Nhắc nhở","Khen"],
  "Thông tin":["Chỉ số","Bộ đếm","Đồng hồ","Kết nối"]
};

let page = "home";
let index = 0;
let stack = [];
let opened = false;

function refresh() {
  panel.hidden = !opened;
  if (!opened) return;

  panel.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = page === "home" ? "MENU OHANA" : page;
  panel.append(heading);

  tree[page].forEach((name,i) => {
    const row = document.createElement("div");
    row.className = "menu-row"+(i === index ? " active" : "");
    row.textContent = (i === index ? "▶ " : "  ")+name;
    panel.append(row);
  });

  panel.children[index+1].scrollIntoView({block:"nearest"});
}

function home() {
  touch();
  page = "home";
  index = 0;
  stack = [];
  opened = true;
  refresh();
}

function exit() {
  touch();
  opened = false;
  refresh();
}

function back() {
  touch();
  if (!opened) return;

  if (stack.length) {
    [page,index] = stack.pop();
    refresh();
  } else {
    exit();
  }
}

function move(step) {
  touch();

  if (!opened) {
    home();
  } else {
    index = (index+step+tree[page].length)%tree[page].length;
    refresh();
  }
}

function duration(milliseconds) {
  const minutes = Math.ceil(Math.max(0,milliseconds)/60000);
  return Math.floor(minutes/60)+"h "+minutes%60+"p";
}

function select() {
  touch();
  update();

  if (!opened) return home();

  if (pet.medicineDue) {
    say("Chờ Stitch uống thuốc xong nhé.");
    return;
  }

  const name = tree[page][index];

  if (tree[name]) {
    stack.push([page,index]);
    page = name;
    index = 0;
    refresh();
    return;
  }

  if (["Cơm","Trái cây","Snack"].includes(name)) {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else if (hunger() < 15) {
      say("Stitch còn no, đừng cho ăn thêm nhé.");
    } else {
      pet.fed = Date.now();
      pet.digestion.push(
        Date.now()+(45+Math.random()*45)*60000
      );
      state.meal = ["Cơm","Trái cây","Snack"].indexOf(name);
      animate(1);
      say("Măm măm! Độ đói sẽ tăng dần trong 9 giờ.");
    }

  } else if (name === "Dọn chất thải") {
    if (!pet.waste) {
      say("Chưa có chất thải để dọn.");
    } else {
      pet.waste = 0;
      state.waste = 0;
      pet.clean = Math.min(100,pet.clean+25);
      animate(8);
      say("Stitch cầm chổi dọn sạch chất thải.");
    }

  } else if (name === "Uống thuốc") {
    if (!pet.sick) {
      say("Stitch khỏe, không cần uống thuốc.");
    } else if (pet.sleep) {
      say("Đánh thức Stitch trước khi uống thuốc nhé.");
    } else {
      pet.medicineDue = Date.now()+5000;
      animate(9);
      say("Stitch đang uống thuốc…");
    }

  } else if (name === "Đi ngủ" || name === "Nghỉ ngơi") {
    pet.sleep = true;
    say("Ngủ hồi năng lượng. Chọn Thức dậy khi muốn.");

  } else if (name === "Thức dậy") {
    pet.sleep = false;
    say("Chào Ohana!");

  } else if (["Nựng","Chơi cùng","Khen"].includes(name)) {
    if (pet.sleep) {
      say("Stitch đang ngủ.");
    } else if (pet.sick && name === "Chơi cùng") {
      say("Stitch đang ốm, cần uống thuốc và nghỉ.");
    } else {
      pet.happy = Math.min(100,pet.happy+15);
      animate(name === "Chơi cùng" ? 14 : 2,
              name === "Chơi cùng" ? 8 : 5);
      say("Ohana! Vui quá!");
    }

  } else if (name === "Nhắc nhở") {
    pet.discipline = Math.min(100,pet.discipline+5);
    animate(10);
    say("Nhắc nhẹ thôi nhé!");

  } else if (name === "Bộ đếm") {
    say(
      "Đói hoàn toàn sau "+
      duration(pet.fed+9*HOUR-Date.now())+
      " • Tiêu hóa: "+
      (pet.digestion.length
        ? duration(Math.min(...pet.digestion)-Date.now())
        : "chưa có")
    );

  } else if (name === "Chỉ số" || name === "Tình trạng") {
    say(
      "Đói "+Math.round(hunger())+
      " • Vui "+Math.round(pet.happy)+
      " • Sức khỏe "+Math.round(pet.health)+
      " • Năng lượng "+Math.round(pet.energy)+
      " • Sạch "+Math.round(pet.clean)+
      " • Kỷ luật "+pet.discipline+
      " • Chất thải "+pet.waste+
      (pet.sick ? " • Đang ốm" : "")
    );

  } else if (name === "Đồng hồ") {
    say(new Date().toLocaleString("vi-VN"));

  } else {
    say("Chưa kết nối Adafruit / ESP32.");
  }

  updateHud();
  save();
  opened = false;
  refresh();
}

document.querySelectorAll("[data-step]").forEach(button => {
  button.onclick = () => move(Number(button.dataset.step));
});

document.getElementById("home").onclick = home;
document.getElementById("back").onclick = back;
document.getElementById("select").onclick = select;
document.getElementById("exit").onclick = exit;

document.addEventListener("keydown",event => {
  const key = event.key.toLowerCase();
  const supported = [
    "arrowup","arrowleft","arrowdown","arrowright",
    "enter","escape","h","x"
  ];

  if (!supported.includes(key)) return;
  event.preventDefault();

  if (event.repeat && ["enter","escape","h","x"].includes(key)) {
    return;
  }

  if (key === "enter") select();
  else if (key === "escape") back();
  else if (key === "h") home();
  else if (key === "x") exit();
  else move(["arrowup","arrowleft"].includes(key) ? -1 : 1);
});

/* Hoạt động dùng thời gian thật, không phụ thuộc tốc độ máy. */
let lastFrame = "";
let lastUpdate = 0;

function loop(now) {
  if (now-lastUpdate > 1000) {
    update();
    lastUpdate = now;
  }

  const time = Date.now();
  const idle = time-lastInput;
  const hour = new Date().getHours();

  if (!opened && !end && !pet.sleep && !pet.sick && pet.energy > 25) {
    if (idle >= 90000 && !idleDance) {
      idleDance = true;
      animate(11,12);
      say("Stitch mặc váy lá nhảy Hawaii!");
    }

    if (idle >= 120000 && !idleCoconut) {
      idleCoconut = true;
      animate(12,10);
      say("Gặm vỏ dừa cho vui — không tính là bữa ăn.");
    }
  }

  if (pet.medicineDue && time >= pet.medicineDue) {
    pet.medicineDue = 0;
    pet.sick = false;
    pet.health = Math.min(100,pet.health+25);
    save();
    say("Đỡ rồi, vẫn cần nghỉ ngơi nhé.");
  }

  if (end && time > end) {
    temporary = 0;
    end = 0;
  }

  state.pose =
    end && temporary === 9 ? 9 :
    pet.sleep ? 4 :
    pet.sick ? 7 :
    end ? temporary :
    (hour >= 22 || hour < 6 || pet.energy < 25) ? 13 :
    0;

  const frame = Math.floor(now/33)%120;
  const key = state.pose+":"+frame+":"+state.waste;

  if (key !== lastFrame) {
    render(state.pose,frame);
    lastFrame = key;
  }

  requestAnimationFrame(loop);
}

say("Ohana! HOME mở menu.");
update();
requestAnimationFrame(loop);
</script>
