<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch — Ohana Pocket</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --shell: #269eea;
  --light: #a5e4ff;
  --dark: #135aa6;
  --border: #141720;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background:
    radial-gradient(circle at 20% 20%, #23283d, transparent 45%),
    radial-gradient(circle at 80% 80%, #1c323a, transparent 45%),
    #121520;
  color: #eef5ff;
  font-family: monospace;
}
.console {
  width: 340px;
  max-width: 94vw;
  padding: 24px;
  background: var(--shell);
  border: 6px solid var(--border);
  border-radius: 36px 36px 22px 22px;
  box-shadow:
    inset 8px 8px 0 var(--light),
    inset -8px -10px 0 var(--dark),
    0 18px 0 #0b0d14,
    0 26px 40px #0008;
}
.brand {
  margin-bottom: 18px;
  text-align: center;
  color: var(--border);
  font: 10px "Press Start 2P", monospace;
  line-height: 1.7;
}
.bezel {
  padding: 12px;
  background: #7d83a8;
  border: 6px solid var(--border);
  box-shadow:
    inset 4px 4px 0 #a5adc9,
    inset -4px -4px 0 #585d7e;
}
.screen {
  position: relative;
  aspect-ratio: 128 / 160;
  overflow: hidden;
  background: #084358;
  border: 5px solid var(--border);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom, #ffffff06 0 2px, transparent 2px 4px
  );
}
.menu {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  padding: 10px;
  background: #18243bf5;
}
.menu[hidden] { display: none; }
.menu h2 {
  margin: 0 0 8px;
  color: #ffd166;
  font-size: 15px;
}
.items { flex: 1; overflow-y: auto; }
.item {
  padding: 7px 4px;
  border: 2px solid transparent;
  font-size: 14px;
  line-height: 1.3;
}
.item.active {
  border-color: var(--shell);
  background: var(--light);
  color: var(--border);
}
.menu-hint {
  padding-top: 7px;
  color: #bdcbe3;
  font-size: 10px;
  line-height: 1.5;
}
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
}
.dpad {
  position: relative;
  width: 108px;
  height: 108px;
  flex-shrink: 0;
}
.dpad button {
  position: absolute;
  width: 36px;
  height: 36px;
  padding: 0;
  color: var(--border);
  background: #868eb2;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #a5adc9,
    inset -3px -3px 0 #616887;
}
.up { top: 0; left: 36px; border-bottom: none !important; }
.down { bottom: 0; left: 36px; border-top: none !important; }
.left { top: 36px; left: 0; border-right: none !important; }
.right { top: 36px; right: 0; border-left: none !important; }
.center {
  position: absolute;
  top: 36px;
  left: 36px;
  width: 36px;
  height: 36px;
  background: #868eb2;
}
.actions {
  display: grid;
  grid-template-columns: repeat(2, 58px);
  gap: 20px 2px;
  text-align: center;
}
.actions button {
  display: block;
  width: 30px;
  height: 30px;
  margin: auto;
  padding: 0;
  border-radius: 50%;
  background: #d45567;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #ec7888,
    inset -3px -3px 0 #9c3445;
}
.actions span {
  display: block;
  margin-top: 8px;
  color: var(--border);
  font: 7px "Press Start 2P", monospace;
}
button {
  cursor: pointer;
  touch-action: manipulation;
}
button:active {
  filter: brightness(.8);
  transform: translateY(2px);
}
button:focus-visible {
  outline: 3px solid #ffd166;
  outline-offset: 2px;
}
.speaker {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}
.speaker i {
  width: 14px;
  height: 44px;
  border: 4px solid var(--border);
  border-radius: 6px;
  background: #2a2f45;
}
footer {
  max-width: 340px;
  text-align: center;
  color: #adbbd4;
  font-size: 12px;
  line-height: 1.8;
}
#message { color: #ffd166; }
</style>
</head>

<body>
<main class="console">
  <div class="brand">OHANA POCKET PET</div>
  <div class="bezel">
    <div class="screen">
      <canvas id="pet" width="128" height="160"
        aria-label="Stitch pixel"></canvas>
      <section class="menu" id="menu" hidden>
        <h2 id="menuTitle">MENU OHANA</h2>
        <div class="items" id="items"></div>
        <div class="menu-hint">
          ↑ ↓ ← → chọn mục<br>
          SELECT xác nhận · BACK quay lại
        </div>
      </section>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Chọn mục menu">
      <button class="up" data-step="-1" aria-label="Lên">▲</button>
      <button class="left" data-step="-1" aria-label="Trái">◀</button>
      <div class="center"></div>
      <button class="right" data-step="1" aria-label="Phải">▶</button>
      <button class="down" data-step="1" aria-label="Xuống">▼</button>
    </div>
    <div class="actions" role="group" aria-label="Điều khiển menu">
      <div>
        <button id="home" aria-label="Home"></button>
        <span>HOME</span>
      </div>
      <div>
        <button id="back" aria-label="Back"></button>
        <span>BACK</span>
      </div>
      <div>
        <button id="select" aria-label="Select"></button>
        <span>SELECT</span>
      </div>
      <div>
        <button id="exit" aria-label="Exit"></button>
        <span>EXIT</span>
      </div>
    </div>
  </div>

  <div class="speaker" aria-hidden="true">
    <i></i><i></i><i></i>
  </div>
</main>

<footer>
  <div id="message" aria-live="polite">
    Ohana! Nhấn HOME để mở menu.
  </div>
  DEMO • Chưa kết nối ESP32 / Adafruit<br>
  Máy tính: phím hướng, Enter, Esc, H, X
</footer>

<script>
"use strict";

const palette = [0, 8452, 15218, 36411, 38037, 2152, 65535, 63887];

const pixels = `
000000000000000000000000000000000000000000000
000000000000000000000000000000000001110000000
000000000000000000000000000000000001111000000
000000000000000000000000000000000001441100000
000000000000000000000000000000000001444110000
001111111000000000000000000000000001444411000
001111111000000000000000000000000001444441100
001444441000000000000000000000000001444444110
001444441000000000000000000000000001444444110
001444441000000000001110000000000001444444110
001444441000000000111111111100000001444444110
001444441000000011112222211111000001444444410
001444441000000112222222222221110001444444410
001444441000001122222222222222211001444444410
001444441000011222222222222222221101444444410
001444441000012332222222222233332101444444410
001444441000123333222222222233333111444444410
001444441001333333222222222233333311444444410
001444441112311333222222222233111311444444110
001444444113111133222222222231661131444410000
001144444111166113222222222231661111444410000
000144444131166113555555555231111111444410000
000114441111111113555555555531111111444410000
000014444111111113555555555531116111444110000
000011444111111113555555555533111111141110000
000011144111111133555555555533111131111100000
000000111111333333555555555533333310011000000
000000001111233333225555555233333100000000000
000000000001111222222555552222211000000000000
000000000000111111111111111111110000000000000
000000000000000022333333333321000000000000000
000000000000000112233333333321000000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322100000000000000
000000000000000212233333333322200000000000000
000000000000000212233333333322210000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322110000000000000
000000000000002212233333333322121000000000000
000000000000012221223333333322221100000000000
000000111111112221223333333222221100000000000
000000222211112221223333333221211111111000000
000001222221112222123333333221211122211110000
000012222222112222123333333221211122222111000
000012555522112222123333333212211122222211000
000012555522111222123333333212211122555521000
000012555522122122123333333212211122555521000
000011222222112111111111111211111122555521000
000011111111111111000000011111111111222211000
000000000000000000000000000000000011111110000
000000000000000000000000000000000000000000000
`.trim().split(/\s+/).map(row => Array.from(row, Number));

const canvas = document.getElementById("pet");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const panel = document.getElementById("menu");
const title = document.getElementById("menuTitle");
const list = document.getElementById("items");
const message = document.getElementById("message");

/* Menu nhiều cấp. */
const menus = {
  root: {
    title: "MENU OHANA",
    items: [
      ["Cho ăn", "food"],
      ["Ốm / Sức khỏe", "health"],
      ["Vệ sinh", "clean"],
      ["Ngủ / Năng lượng", "sleep"],
      ["Nựng / Vui chơi", "play"],
      ["Kỷ luật", "discipline"],
      ["AI (xem thử)", "ai"],
      ["Thông tin", "info"]
    ]
  },
  food: {
    title: "CHO ĂN",
    items: [
      ["Bữa chính", "mainFood"],
      ["Trái cây", "fruit"],
      ["Snack", "snack"]
    ]
  },
  mainFood: {
    title: "BỮA CHÍNH",
    items: [["Cơm", "@rice"], ["Cá", "@fish"]]
  },
  fruit: {
    title: "TRÁI CÂY",
    items: [["Táo", "@apple"], ["Chuối", "@banana"]]
  },
  snack: {
    title: "SNACK",
    items: [["Bánh quy", "@cookie"], ["Bánh ngọt", "@cake"]]
  },
  health: {
    title: "SỨC KHỎE",
    items: [
      ["Nghỉ ngơi", "@rest"],
      ["Uống thuốc", "@medicine"],
      ["Xem tình trạng", "@check"],
      ["Dáng ốm (demo)", "@sick"]
    ]
  },
  clean: {
    title: "VỆ SINH",
    items: [["Dọn chất thải", "@clean"]]
  },
  sleep: {
    title: "NĂNG LƯỢNG",
    items: [["Đi ngủ", "@sleep"], ["Thức dậy", "@wake"]]
  },
  play: {
    title: "VUI CHƠI",
    items: [["Nựng Stitch", "@pet"], ["Chơi cùng Stitch", "@play"]]
  },
  discipline: {
    title: "KỶ LUẬT",
    items: [["Nhắc nhở nhẹ", "@train"], ["Khen Stitch", "@praise"]]
  },
  ai: {
    title: "ANIMATION AI",
    items: [
      ["Đang nghe (demo)", "@listen"],
      ["Suy nghĩ (demo)", "@think"]
    ]
  },
  info: {
    title: "THÔNG TIN",
    items: [
      ["Chỉ số nuôi", "@stats"],
      ["Đồng hồ", "@clock"],
      ["Kết nối", "@connection"]
    ]
  }
};

/* Chỉ xem thử: không gửi lệnh chăm sóc hoặc thay đổi chỉ số. */
const actions = {
  rice:     [1, "Măm cơm nào!", 0],
  fish:     [1, "Măm cá nào!", 0],
  apple:    [1, "Táo giòn ngon quá!", 1],
  banana:   [1, "Chuối ngon quá!", 1],
  cookie:   [1, "Một chiếc bánh nhé!", 2],
  cake:     [1, "Bánh thơm quá!", 2],
  rest:     [4, "Stitch đang nghỉ ngơi."],
  medicine: [9, "Demo: Stitch uống thuốc."],
  sick:     [7, "Demo: Stitch đang ốm."],
  clean:    [8, "Demo: Stitch quét dọn."],
  sleep:    [4, "Chúc Stitch ngủ ngon!"],
  wake:     [0, "Stitch thức dậy rồi!"],
  pet:      [2, "Ohana! Thích được nựng!"],
  play:     [2, "Chơi cùng Ohana nào!"],
  train:    [10, "Stitch sẽ ngoan mà!"],
  praise:   [2, "Ohana khen Stitch nè!"],
  listen:   [5, "Demo đang nghe — không thu âm."],
  think:    [6, "Demo: Stitch đang suy nghĩ."]
};

let current = "root";
let selected = 0;
let stack = [];
let opened = false;

let pose = 0;
let meal = 0;
let actionEnds = 0;
let lastFrame = "";

function refreshMenu() {
  panel.hidden = !opened;
  if (!opened) return;

  title.textContent = menus[current].title;
  list.replaceChildren();

  menus[current].items.forEach(([label], index) => {
    const row = document.createElement("div");
    row.className = "item" + (index === selected ? " active" : "");
    row.textContent = (index === selected ? "▶ " : "  ") + label;
    list.appendChild(row);
  });

  list.children[selected].scrollIntoView({ block: "nearest" });
}

function home() {
  stack = [];
  current = "root";
  selected = 0;
  opened = true;
  refreshMenu();
}

function exit() {
  opened = false;
  refreshMenu();
}

function back() {
  if (!opened) return;
  if (stack.length) {
    const previous = stack.pop();
    current = previous.current;
    selected = previous.selected;
    refreshMenu();
  } else {
    exit();
  }
}

function move(step) {
  if (!opened) {
    home();
    return;
  }
  const count = menus[current].items.length;
  selected = (selected + step + count) % count;
  refreshMenu();
}

function select() {
  if (!opened) {
    home();
    return;
  }

  const target = menus[current].items[selected][1];

  if (!target.startsWith("@")) {
    stack.push({ current, selected });
    current = target;
    selected = 0;
    refreshMenu();
    return;
  }

  const id = target.slice(1);

  if (id === "clock") {
    message.textContent =
      "Giờ trên trình duyệt: " + new Date().toLocaleString("vi-VN");
    exit();
    return;
  }

  const notices = {
    check: "Chưa có dữ liệu sức khỏe từ ESP32.",
    stats: "Chưa đồng bộ chỉ số từ ESP32.",
    connection: "Offline demo — chưa kết nối Adafruit."
  };

  if (notices[id]) {
    message.textContent = notices[id];
    exit();
    return;
  }

  const action = actions[id];
  if (!action) return;

  pose = action[0];
  meal = action[2] || 0;
  message.textContent = action[1];

  actionEnds = ["rest", "sleep"].includes(id)
    ? Infinity
    : performance.now() + 6000;

  lastFrame = "";
  exit();
}

document.getElementById("home").onclick = home;
document.getElementById("back").onclick = back;
document.getElementById("select").onclick = select;
document.getElementById("exit").onclick = exit;

document.querySelectorAll("[data-step]").forEach(button => {
  button.onclick = () => move(Number(button.dataset.step));
});

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  const supported = [
    "arrowup", "arrowdown", "arrowleft", "arrowright",
    "enter", "escape", "h", "x"
  ];
  if (!supported.includes(key)) return;
  event.preventDefault();

  if (key === "enter") select();
  else if (key === "escape") back();
  else if (key === "h") home();
  else if (key === "x") exit();
  else move(["arrowup", "arrowleft"].includes(key) ? -1 : 1);
});

/* Các màu sprite gốc dùng định dạng RGB565. */
function color(value) {
  const r = Math.round(((value >> 11) & 31) * 255 / 31);
  const g = Math.round(((value >> 5) & 63) * 255 / 63);
  const b = Math.round((value & 31) * 255 / 31);
  return `rgb(${r},${g},${b})`;
}

function rect(x, y, width, height, value) {
  ctx.fillStyle = color(value);
  ctx.fillRect(Math.round(x), Math.round(y), width, height);
}

function text(x, y, value, fill = "#ffffff") {
  ctx.fillStyle = fill;
  ctx.font = "8px monospace";
  ctx.fillText(value, Math.round(x), Math.round(y));
}

/* Thay biểu cảm mắt, miệng và má theo trạng thái. */
function ink(x, y, p, frame) {
  let value = pixels[y][x];

  const eyes =
    (x >= 10 && x <= 16 && y >= 18 && y <= 25) ||
    (x >= 29 && x <= 34 && y >= 18 && y <= 25);

  if (eyes && [2, 3, 4, 7].includes(p)) {
    const center = x < 20 ? 13 : 31;
    value = p === 2
      ? (y === 21 + (Math.abs(x - center) > 1 ? 1 : 0) ? 1 : 3)
      : (y === 23 ? 1 : 3);
  }

  if (x >= 19 && x <= 27 && y >= 28 && y <= 29) {
    if (p === 1) value = frame ? 7 : 1;
    if (p === 2) value = y === 28 && x > 20 && x < 26 ? 7 : 1;
    if (p === 7) value = y === 28 && x > 20 && x < 26 ? 1 : 2;
  }

  if (
    p === 2 && y === 26 &&
    ((x >= 12 && x <= 14) || (x >= 31 && x <= 33))
  ) value = 7;

  if (
    p === 5 && y === 19 &&
    ((x >= 13 && x <= 14) || (x >= 30 && x <= 31))
  ) value = 6;

  return value;
}

function heart(x, y) {
  rect(x, y, 3, 3, 0xf98f);
  rect(x + 5, y, 3, 3, 0xf98f);
  rect(x, y + 3, 8, 3, 0xf98f);
  rect(x + 2, y + 6, 4, 2, 0xf98f);
}

function render(p, frame) {
  const t = frame / 12 * Math.PI * 2;

  rect(0, 0, 128, 160, p === 4 ? 0 : 0x0843);
  text(5, 12, "STITCH / OHANA", "#a5e4ff");
  rect(0, 137, 128, 1, 0x2152);
  text(5, 151, "OFFLINE DEMO", "#ffd166");

  let x = 25;
  let y = 46;
  let width = 78;
  let height = 88;
  let flip = false;

  // Bình thường: đi qua lại, đổi hướng và nhún nhẹ.
  if (p === 0) {
    x += Math.round(17 * Math.sin(t));
    y += Math.round(2 * Math.abs(Math.sin(t * 2)));
    flip = Math.cos(t) < 0;
  }

  // Ăn: nhún người.
  if (p === 1) y -= Math.round(3 * Math.abs(Math.sin(t)));

  // Nựng / chơi: nhảy.
  if (p === 2) {
    y -= Math.round(12 * Math.abs(Math.sin(t)));
    x += Math.round(3 * Math.sin(t));
  }

  // Ngủ: dáng thấp, nằm và thở nhẹ.
  if (p === 4) {
    x = 20;
    y = 99;
    width = 88;
    height = 36 + Math.round(Math.sin(t));
  }

  // Nghe và suy nghĩ: nghiêng qua lại.
  if (p === 5) x += Math.round(3 * Math.sin(t));
  if (p === 6) x += Math.round(4 * Math.sin(t));

  // Ốm: run nhẹ, hạ người.
  if (p === 7) {
    x += frame % 2;
    y += 4;
    height = 84;
  }

  // Dọn: di chuyển qua lại.
  if (p === 8) {
    x += Math.round(14 * Math.sin(t));
    flip = Math.cos(t) < 0;
  }

  if (p === 9) y -= Math.round(2 * Math.abs(Math.sin(t)));
  if (p === 10) y -= Math.round(4 * Math.abs(Math.sin(t)));

  // Bóng dưới chân.
  rect(x + 14, 135, width - 28, 2, 0x2104);

  // Vẽ sprite, giữ cạnh pixel sắc nét.
  for (let sy = 0; sy < height; sy++) {
    for (let sx = 0; sx < width; sx++) {
      let ax = Math.floor(sx * 45 / width);
      let ay = Math.floor(sy * 51 / height);

      if (flip) ax = 44 - ax;

      // Rung tai.
      if (ay < 18 && p !== 4) {
        ay = Math.max(0, Math.min(
          50,
          ay + Math.round(Math.sin(t) * (ax < 10 ? 1 : -1))
        ));
      }

      const expression = p === 0 && frame === 0 ? 3 : p;
      const value = ink(ax, ay, expression, frame < 6 ? 0 : 1);

      if (value) rect(x + sx, y + sy, 1, 1, palette[value]);
    }
  }

  const wave = Math.round(3 * Math.sin(t));

  // Thức ăn đi lên miệng và vụn thức ăn.
  if (p === 1) {
    const foodY = 100 - Math.round(13 * (1 + Math.sin(t)) / 2);
    rect(x + 32, foodY, 12, 7, [0xffff, 0x07e0, 0xfd20][meal]);
    rect(x + 34, foodY + 7, 8, 2, 0x2104);
    if (frame > 7) {
      rect(x + 30, foodY + 4, 2, 2, 0xffe0);
      rect(x + 47, foodY + 6, 2, 2, 0xffe0);
    }
  }

  // Tim bay lên.
  if (p === 2) {
    for (let i = 0; i < 2; i++) {
      heart(10 + i * 97, 75 - ((frame + i * 5) % 12) * 3);
    }
  }

  // Chữ Z bay lên khi ngủ.
  if (p === 4) text(85, 82 - frame * 2, "ZZZ");

  // Vạch âm thanh minh họa, không thu mic.
  if (p === 5) {
    for (let i = 0; i < 3; i++) {
      rect(
        109 + i * 4,
        78 - wave * (i + 1),
        2,
        6 + Math.abs(wave) * (i + 1),
        0x65ff
      );
    }
  }

  // Dấu hỏi và chấm chờ.
  if (p === 6) {
    text(99, 48, "?", "#ffd166");
    for (let i = 0; i < 3; i++) {
      rect(
        102 + i * 7, 66, 3, 3,
        i === Math.floor(frame / 4) ? 0xffff : 0x2152
      );
    }
  }

  // Mồ hôi khi ốm.
  if (p === 7) {
    text(3, 118, "OM...", "#ff7888");
    rect(x + 58, 83 + frame % 4, 2, 4, 0x65ff);
  }

  // Chổi quét và bụi.
  if (p === 8) {
    rect(x + 62 + wave, 104, 2, 23, 0xfd20);
    rect(x + 57 + wave, 125, 12, 4, 0xffff);
    rect(108, 130, 10, 4, 0x8200);
    rect(110, 127, 6, 3, 0x8200);
    if (frame > 7) {
      rect(106, 120, 2, 2, 0xffff);
      rect(119, 124, 2, 2, 0xffff);
    }
  }

  // Lọ thuốc và viên thuốc đưa lên miệng.
  if (p === 9) {
    rect(105, 96, 13, 17, 0xffff);
    rect(110, 98, 3, 13, 0xf800);
    rect(107, 103, 9, 3, 0xf800);
    rect(
      x + 34,
      105 - Math.round(17 * (1 + Math.sin(t)) / 2),
      5, 3, 0xffff
    );
  }

  // Kỷ luật: nhún, cử động tay và dấu chấm than.
  if (p === 10) {
    text(106, 70 - wave, "!", "#ffd166");
    rect(x + 9, 104 - wave, 6, 3, 0x3b72);
  }
}

/* Chỉ vẽ khi khung animation hoặc trạng thái thay đổi. */
function loop(now) {
  if (actionEnds && now > actionEnds) {
    pose = 0;
    actionEnds = 0;
  }

  const frame = Math.floor(now / 100) % 12;
  const key = pose + ":" + meal + ":" + frame;

  if (key !== lastFrame) {
    render(pose, frame);
    lastFrame = key;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
