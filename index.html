<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch — Ohana Pocket</title>

<style>
:root {
  --shell: #269eea;
  --light: #a5e4ff;
  --dark: #135aa6;
  --border: #141720;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background:
    radial-gradient(circle at 20% 20%, #23283d, transparent 45%),
    radial-gradient(circle at 80% 80%, #1c323a, transparent 45%),
    #121520;
  color: #eef5ff;
  font-family: monospace;
}

.console {
  width: 340px;
  max-width: 94vw;
  padding: 24px;
  background: var(--shell);
  border: 6px solid var(--border);
  border-radius: 36px 36px 22px 22px;
  box-shadow:
    inset 8px 8px 0 var(--light),
    inset -8px -10px 0 var(--dark),
    0 18px 0 #0b0d14,
    0 26px 40px #0008;
}

.brand {
  margin-bottom: 18px;
  text-align: center;
  color: var(--border);
  font: bold 12px monospace;
  letter-spacing: 2px;
}

.bezel {
  padding: 12px;
  background: #7d83a8;
  border: 6px solid var(--border);
  box-shadow:
    inset 4px 4px 0 #a5adc9,
    inset -4px -4px 0 #585d7e;
}

.screen {
  position: relative;
  aspect-ratio: 128 / 160;
  overflow: hidden;
  background: #084358;
  border: 5px solid var(--border);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    #ffffff06 0 2px,
    transparent 2px 4px
  );
}

/* Giờ và hai thanh chỉ dùng biểu tượng. */
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 5px;
  padding: 6px 5px;
  background: #084358;
  pointer-events: none;
}

.clock {
  padding-top: 3px;
  color: #ffd166;
  font: bold 12px monospace;
  white-space: nowrap;
}

.status-bars {
  display: grid;
  gap: 4px;
  width: 58%;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 12px;
}

.status-row svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  shape-rendering: crispEdges;
}

.track {
  flex: 1;
  height: 8px;
  border: 1px solid #bddce8;
  background: #102437;
  overflow: hidden;
}

.fill {
  display: block;
  height: 100%;
  width: 0;
}

#spiritFill { background: #ff789e; }
#hungerFill { background: #ffc56b; }

.menu {
  position: absolute;
  inset: 0;
  z-index: 3;
  padding: 10px;
  overflow: auto;
  background: #18243bf5;
  font: 14px monospace;
}

.menu[hidden] {
  display: none;
}

.menu h3 {
  margin: 0 0 10px;
  color: #ffd166;
  font-size: 15px;
}

.menu-row {
  padding: 7px 3px;
  line-height: 1.3;
}

.menu-row.active {
  background: var(--light);
  color: var(--border);
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
}

.dpad {
  position: relative;
  width: 108px;
  height: 108px;
  flex-shrink: 0;
}

.dpad button {
  position: absolute;
  width: 36px;
  height: 36px;
  padding: 0;
  color: var(--border);
  background: #868eb2;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #a5adc9,
    inset -3px -3px 0 #616887;
}

.up {
  top: 0;
  left: 36px;
  border-bottom: none !important;
}

.down {
  bottom: 0;
  left: 36px;
  border-top: none !important;
}

.left {
  top: 36px;
  left: 0;
  border-right: none !important;
}

.right {
  top: 36px;
  right: 0;
  border-left: none !important;
}

.center {
  position: absolute;
  top: 36px;
  left: 36px;
  width: 36px;
  height: 36px;
  background: #868eb2;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, 58px);
  gap: 20px 2px;
  text-align: center;
}

.actions button {
  display: block;
  width: 30px;
  height: 30px;
  margin: auto;
  padding: 0;
  border-radius: 50%;
  background: #d45567;
  border: 5px solid var(--border);
  box-shadow:
    inset 3px 3px 0 #ec7888,
    inset -3px -3px 0 #9c3445;
}

.actions span {
  display: block;
  margin-top: 8px;
  color: var(--border);
  font: bold 9px monospace;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  filter: brightness(.8);
  transform: translateY(2px);
}

button:focus-visible {
  outline: 3px solid #ffd166;
  outline-offset: 2px;
}

.speaker {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}

.speaker i {
  width: 14px;
  height: 44px;
  border: 4px solid var(--border);
  border-radius: 6px;
  background: #2a2f45;
}

footer {
  max-width: 360px;
  text-align: center;
  color: #adbbd4;
  font-size: 12px;
  line-height: 1.8;
}

#message {
  margin-bottom: 8px;
  color: #ffd166;
}
</style>
</head>

<body>
<main class="console">
  <div class="brand">OHANA POCKET PET</div>

  <div class="bezel">
    <div class="screen">
      <canvas
        id="petCanvas"
        width="128"
        height="160"
        aria-label="Stitch pixel"
      ></canvas>

      <div class="hud">
        <time class="clock" id="petClock">00:00</time>

        <div class="status-bars">
          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ff789e"
                d="M1 2h4v1h2V2h4v5H9v2H7v2H5V9H3V7H1z"
              />
              <path fill="#ffd1e0" d="M2 3h2v1H2z"/>
            </svg>

            <div
              class="track"
              id="spiritTrack"
              role="progressbar"
              aria-label="Tinh thần"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <i class="fill" id="spiritFill"></i>
            </div>
          </div>

          <div class="status-row">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                fill="#ffc56b"
                d="M3 1h6v1h2v7H9v2H3V9H1V2h2z"
              />
              <path
                fill="#995c2d"
                d="M4 3h2v2H4zM8 5h1v2H8zM3 7h2v2H3z"
              />
            </svg>

            <div
              class="track"
              id="hungerTrack"
              role="progressbar"
              aria-label="Độ đói"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <i class="fill" id="hungerFill"></i>
            </div>
          </div>
        </div>
      </div>

      <section id="menu" class="menu" hidden></section>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" role="group" aria-label="Chọn mục menu">
      <button class="up" data-step="-1" aria-label="Lên">▲</button>
      <button class="left" data-step="-1" aria-label="Trái">◀</button>
      <div class="center"></div>
      <button class="right" data-step="1" aria-label="Phải">▶</button>
      <button class="down" data-step="1" aria-label="Xuống">▼</button>
    </div>

    <div class="actions">
      <div>
        <button id="home" aria-label="Home"></button>
        <span>HOME</span>
      </div>
      <div>
        <button id="back" aria-label="Back"></button>
        <span>BACK</span>
      </div>
      <div>
        <button id="select" aria-label="Select"></button>
        <span>SELECT</span>
      </div>
      <div>
        <button id="exit" aria-label="Exit"></button>
        <span>EXIT</span>
      </div>
    </div>
  </div>

<p id="weatherStatus" role="status" hidden>Chưa có vị trí — nền chỉ theo giờ máy.</p>
<p style="font-size:11px">Dữ liệu: <a href="https://open-meteo.com/" style="color:#a5e4ff">Open-Meteo</a> (CC BY 4.0)</p>
<div class="speaker" aria-hidden="true">
    <i></i><i></i><i></i>
  </div>
</main>

<footer>
  <div id="message" aria-live="polite"></div>
  Pixel 2D, không dùng model 3D • Chưa đồng bộ ESP32 / Adafruit<br>
  Phím hướng: chọn · Enter: xác nhận · Esc: quay lại<br>
  H: HOME · X: EXIT
</footer>

<script>
"use strict";

/* Sprite Stitch pixel, bảng màu RGB565. */
const palette = [0, 0, 21492, 1658, 45972, 8558, 65535, 64400, 24587, 65369];

const pixels = `
000000000000000000000000000000000000000000000
000000000111000000000000000000001110000000000
000000111441100000000000000000014411100000000
000001144444110000000000000000144444410000000
000011444444410000000000000000144444441000000
000014444444410000000000000000144444444100000
000004444444410000000000000000144444441000000
000111444444410000000000000000144444441100000
001144444444410000000110000000144444444111000
001444444444410000001111000000144444444441000
001444444444410011111221111110144444444441000
001444444444411112222222222221114444444441000
001444444444112222222222222222211444444441000
001444444444122222222222222222221444444441000
001444444441222222222222222222221144444441000
001444444441223322222222222333222144444441000
001444444441233333222222223333322144444441000
001444444412333333322222233333332114444441000
001444444413331113322222233111332214444441000
001444444413316611321111131116633214444441000
000144444413116611111555111116613214444410000
000144444433111111115555511111113214444410000
000114444133111111155555551111113321444110000
000014444133111111155555551111133221441100000
000011444123311133315555513111332211411000000
000001111112333322221111122233322111110000000
000000111211112222221888822222111121100000000
000000000111118998899888899889911100000000000
000000000000111888877777777788110000000000000
000000000000000000000000000000000000000000000
000000000000000111111111111110000000000000000
000000000000000122333333332210000000000000000
000000000000001122333333332211000000000000000
000000000000001123333333333211000000000000000
000000000000001123333333333211000000000000000
000000000000001223333333333221000000000000000
000000000000011222333333332221100000000000000
000000000000011222333333332221100000000000000
000000000000111222233333332221110000000000000
000000000001111222233333322221111000000000000
000000000011112222223333322222111110000000000
000000112221122222223333322222211112220000000
000011222222222222223333322222221222222100000
000011225222222222223333322222222225222200000
000011255522222222222333222222222255522200000
000011255552222222222333222222221255552200000
000011225552222222221333222222221225552200000
000001122222122222221111122222221122222000000
000000111221112212210000011221221111220000000
000000011111111111100000001111111111100000000
000000000000000000000000000000000000000000000
`.trim().split(/\s+/).map(row => Array.from(row, Number));

const canvas = document.getElementById("petCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const panel = document.getElementById("menu");
const message = document.getElementById("message");

const clockElement = document.getElementById("petClock");
const spiritFill = document.getElementById("spiritFill");
const hungerFill = document.getElementById("hungerFill");
const spiritTrack = document.getElementById("spiritTrack");
const hungerTrack = document.getElementById("hungerTrack");

const state = {
  pose: 0,
  meal: 0,
  waste: 0
};

function color(value) {
  const r = Math.round(((value >> 11) & 31) * 255 / 31);
  const g = Math.round(((value >> 5) & 63) * 255 / 63);
  const b = Math.round((value & 31) * 255 / 31);
  return `rgb(${r},${g},${b})`;
}

function rect(x, y, w, h, c) {
  ctx.fillStyle = color(c);
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function text(x, y, value, c = 0xffff, size = 8) {
  ctx.fillStyle = color(c);
  ctx.font = size + "px monospace";
  ctx.fillText(value, x, y);
}

function ink(x, y, pose, frame) {
  let c = pixels[y][x];

  // Mask the entire original pupil, mirrored on the same sprite grid.
  const eyeSpans = {18:[13,17],19:[12,18],20:[12,18],21:[12,18],22:[12,18],23:[12,18],24:[13,18],25:[13,17]};
  const span = eyeSpans[y];
  const eyeX = x > 22 ? 44-x : x;
  const eyes = span && eyeX >= span[0] && eyeX <= span[1];

  if (eyes && [2, 3, 4, 7, 13].includes(pose)) {
    const center = x < 20 ? 13 : 31;

    c = pose === 2
      ? (y === 21 + (Math.abs(x - center) > 1 ? 1 : 0) ? 1 : 3)
      : (y === 23 ? 1 : 3);
  }

  if (x >= 19 && x <= 27 && y >= 28 && y <= 29) {
    if (pose === 1) c = frame ? 7 : 1;
    if (pose === 2) c = y === 28 && x > 20 && x < 26 ? 7 : 1;
    if (pose === 7) c = y === 28 && x > 20 && x < 26 ? 1 : 2;
  }

  if (
    pose === 2 && y === 26 &&
    ((x >= 12 && x <= 14) || (x >= 31 && x <= 33))
  ) {
    c = 7;
  }

  return c;
}

function heart(x, y) {
  rect(x, y, 3, 3, 0xf98f);
  rect(x + 5, y, 3, 3, 0xf98f);
  rect(x, y + 3, 8, 3, 0xf98f);
  rect(x + 2, y + 6, 4, 2, 0xf98f);
}

/*
  0 bình thường; 1 ăn; 2 vui; 3 chớp mắt; 4 ngủ;
  7 ốm; 8 dọn; 9 thuốc; 10 kỷ luật;
  11 Hawaii; 12 dừa; 13 buồn ngủ.
*/
// Pixel geometry is drawn on the same integer grid as the face.
let poseStart=Date.now(), drawnPose=-1;
function poly(points,c){ctx.fillStyle=color(c);ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(Math.round(x),Math.round(y)):ctx.moveTo(Math.round(x),Math.round(y)));ctx.closePath();ctx.fill();}
function limb(a,b,c,width=7){
 const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
 const nx=-dy/len*width/2,ny=dx/len*width/2;
 poly([[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]],0x0000);
 poly([[a[0]+nx*.65,a[1]+ny*.65],[b[0]+nx*.65,b[1]+ny*.65],[b[0]-nx*.65,b[1]-ny*.65],[a[0]-nx*.65,a[1]-ny*.65]],c);
}
function head(cx,top,expression,blink=false,yawn=0){
 const beat=Math.floor((Date.now()-poseStart)/160)%4;
 const expressive=[1,8,9,10,11,12,15].includes(expression);
 // Keep the approved face, but never stretch or rotate its seated body.
 for(let ay=0;ay<30;ay++)for(let ax=0;ax<45;ax++){
  let c=ink(ax,ay,blink && expression===0?3:expression,1);
  if(expressive && ay>=26){
   const edges={26:[9,35],27:[12,32],28:[15,29],29:[16,29]};
   const edge=edges[ay];
   c=edge && ax>=edge[0] && ax<=edge[1] ? (ax===edge[0]||ax===edge[1]?1:2):0;
  }
  // Replace the original smile itself during yawning, including its teeth.
  if(expression===13 && ay>=26){
   // Preserve the tapered silhouette instead of painting a rectangular muzzle.
   const edges={26:[9,35],27:[12,32],28:[15,29],29:[16,29]};
   const edge=edges[ay];
   c=edge && ax>=edge[0] && ax<=edge[1]
     ? (ax===edge[0] || ax===edge[1] ? 1 : 2) : 0;
  }
  if(c)rect(cx-45+ax*2,top+ay*2,2,2,palette[c]);
 }
 if(expressive){
  const my=top+54;
  if(expression===1 || expression===12){
   // Bite, closed chew, open chew, closed chew; no old smile underneath.
   const opening=[4,2,6,2][beat];
   rect(cx-8,my-2,16,opening+2,0x0000);
   if(opening>2){rect(cx-6,my,12,opening-2,0x680a);rect(cx-4,my+opening-2,8,2,0xf98f);}
   else {rect(cx-12,my,4,2,0x216e);rect(cx+8,my,4,2,0x216e);}
  }else if(expression===9){
   rect(cx-4,my-2,8,6,0x0000);rect(cx-2,my,4,2,0x680a);
  }else if(expression===10 || expression===15){
   rect(cx-8,my+2,16,2,0x0000);rect(cx-10,my+4,2,2,0x0000);rect(cx+8,my+4,2,2,0x0000);
  }else{
   rect(cx-10,my,20,2,0x0000);rect(cx-12,my-2,2,2,0x0000);rect(cx+10,my-2,2,2,0x0000);
  }
  if(expression===15 || expression===10){
   rect(cx-22,top+32,10,2,0x216e);rect(cx+12,top+32,10,2,0x216e);
   if(expression===15){rect(cx-20,top+50,6,2,0xf98f);rect(cx+16,top+50,6,2,0xf98f);}
  }
 }
 if(expression===13){
  // Relaxed eyelids; the mouth opens and closes during each yawn.
  const opening=2*Math.round(yawn*7);
  if(opening>2){
   // Stepped pixel mouth: separate cream teeth, not a white bar.
   const w=24-2*Math.round(yawn*2), left=cx-w/2, mt=top+50;
   poly([[left+4,mt],[left+w-4,mt],[left+w,mt+4],[left+w,mt+opening],[left+w-4,mt+opening+4],[left+4,mt+opening+4],[left,mt+opening],[left,mt+4]],0x0000);
   poly([[left+4,mt+2],[left+w-4,mt+2],[left+w-2,mt+4],[left+w-2,mt+opening],[left+w-4,mt+opening+2],[left+4,mt+opening+2],[left+2,mt+opening],[left+2,mt+4]],0x680a);
   if(opening>=8){
    rect(cx-8,mt+opening-2,16,4,0xf98f);
    rect(cx-6,mt+opening-4,12,2,0xf98f);
   }
   const cream=0xff59;
   for(const tx of [left+4,cx-6,cx+4,left+w-8]){
    rect(tx,mt+2,4,2,cream);
    rect(tx+1,mt+4,2,2,cream);
   }
   if(opening>=10){
    for(const tx of [left+6,left+w-10]){
     rect(tx+1,mt+opening-2,2,2,cream);
     rect(tx,mt+opening,4,2,cream);
    }
   }
  }else {
   rect(cx-10,top+54,20,2,0x0000);
  }
 }
}
// Side-facing head for rightward running, drawn directly on the pixel grid.
function runHead(cx,top){
 poly([[cx-17,top+15],[cx-29,top+3],[cx-36,top+4],[cx-34,top+28],[cx-22,top+37]],0x0000);
 poly([[cx-20,top+17],[cx-31,top+7],[cx-32,top+25],[cx-22,top+32]],0xb394);
 poly([[cx-23,top+20],[cx-12,top+12],[cx+8,top+14],[cx+20,top+26],[cx+23,top+39],[cx+31,top+43],[cx+28,top+52],[cx+9,top+59],[cx-13,top+55],[cx-24,top+42]],0x0000);
 poly([[cx-20,top+22],[cx-10,top+16],[cx+7,top+18],[cx+17,top+28],[cx+19,top+42],[cx+27,top+45],[cx+25,top+49],[cx+8,top+55],[cx-11,top+51],[cx-20,top+40]],0x53f4);
 poly([[cx+1,top+29],[cx+13,top+29],[cx+17,top+42],[cx+8,top+48],[cx-1,top+42]],0x067a);
 rect(cx+6,top+32,9,12,0x0000);rect(cx+10,top+33,4,4,0xffff);
 rect(cx+20,top+40,12,8,0x216e);rect(cx+10,top+50,13,2,0x0000);
}
function neck(cx,top){
 // A short tapered bridge behind the chin, not a rectangular collar.
 for(const [y,l,r] of [[58,-9,11],[60,-11,13],[62,-13,15]]){
  rect(cx+l,top+y,r-l,2,0x0000);
  rect(cx+l+2,top+y,r-l-4,2,0x53f4);
 }
}
function seated(cx,top,pose){
 // The face and seated body share EXACTLY the same 2x pixel grid.
 for(let ay=30;ay<51;ay++)for(let ax=0;ax<45;ax++){
  const c=ink(ax,ay,pose,1);
  if(c)rect(cx-45+ax*2,top+ay*2,2,2,palette[c]);
 }
}
// Location is requested only by an explicit click; never saved or sent to pet sync.
const weather={code:null,temperature:null,updated:0,coords:null,busy:false};
const weatherStatus=document.getElementById('weatherStatus');
function weatherLabel(c){
 if(c===0)return 'Trời quang';if(c<=3)return 'Có mây';if(c<=48)return 'Sương mù';
 if(c<=67 || (c>=80 && c<=82))return 'Mưa';if(c<=77 || c===85 || c===86)return 'Tuyết';return 'Giông';
}
async function refreshWeather(){
 if(!weather.coords || weather.busy)return;
 weather.busy=true;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const [lat,lon]=weather.coords;
  const response=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=temperature_2m,weather_code`,{signal:controller.signal});
  if(!response.ok)throw new Error('http');
  const current=(await response.json()).current;
  if(!current || !Number.isFinite(current.weather_code) || !Number.isFinite(current.temperature_2m))throw new Error('data');
  weather.code=current.weather_code;weather.temperature=current.temperature_2m;weather.updated=Date.now();

/* Luật nuôi và lưu trạng thái. */
const KEY = "ohana-pet-v2";
const HOUR = 3600000;

let pet;

try {
  pet = JSON.parse(localStorage.getItem(KEY));
} catch (error) {}

if (!pet || pet.version !== 2) {
  pet = {
    version: 2,
    last: Date.now(),
    fed: Date.now(),
    happy: 80,
    energy: 85,
    clean: 100,
    health: 100,
    discipline: 70,
    waste: 0,
    digestion: [],
    sick: false,
    sleep: false,
    nextIll: Date.now() + 12 * HOUR + Math.random() * 12 * HOUR
  };
}

let lastInput = Date.now();
let idleDance = false;
let idleCoconut = false;
let temporary = 0;
let end = 0;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(pet));
  } catch (error) {}
}

function say(value) {
  message.textContent = value;
}

function touch() {
  lastInput = Date.now();
  idleDance = false;
  idleCoconut = false;
}

function animate(pose, seconds = 5) {
  temporary = pose;
  end = Date.now() + seconds * 1000;
}

function hunger() {
  return Math.min(
    100,
    Math.max(0, (Date.now() - pet.fed) / (9 * HOUR) * 100)
  );
}

let previousHud = "";

function updateHud() {
  const now = new Date();
  const clock =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

  const spirit = Math.round(Math.max(0, Math.min(100, pet.happy)));
  const hungry = Math.round(hunger());
  const key = clock + ":" + spirit + ":" + hungry;

  if (key === previousHud) return;
  previousHud = key;

  clockElement.textContent = clock;
  spiritFill.style.width = spirit + "%";
  hungerFill.style.width = hungry + "%";
  hungerFill.style.background = hungry >= 80 ? "#ff6565" : "#ffc56b";

  spiritTrack.setAttribute("aria-valuenow", spirit);
  hungerTrack.setAttribute("aria-valuenow", hungry);
}

function update() {
  const now = Date.now();
  const hours = Math.max(0, (now - pet.last) / HOUR);

  pet.last = now;
  pet.happy = Math.max(0, pet.happy - hours * 3);

  pet.energy = Math.max(0, Math.min(
    100,
    pet.energy + hours * (pet.sleep ? 15 : -4)
  ));

  pet.clean = Math.max(
    0,
    pet.clean - hours * (pet.waste ? 6 : 1)
  );

  pet.digestion = pet.digestion.filter(deadline => {
    if (deadline <= now) {
      pet.waste++;
      return false;
    }
    return true;
  });

  const neglected =
    pet.clean < 40 || hunger() > 85 || pet.energy < 20;

  if (now >= pet.nextIll) {
    if (neglected && Math.random() < 0.45) {
      pet.sick = true;
      say("Stitch thấy không khỏe, cần chăm sóc.");
    }

    pet.nextIll = now + 6 * HOUR + Math.random() * 6 * HOUR;
  }

  pet.health = Math.max(0, Math.min(
    100,
    pet.health + hours * (pet.sick ? -3 : pet.sleep ? 2 : 0)
  ));

  if(pet.medicineDue && now>=pet.medicineDue){pet.medicineDue=0;pet.sick=false;pet.health=Math.min(100,pet.health+25);say("Uống xong rồi, Ohana!");}
  if(pet.cleaningDue && now>=pet.cleaningDue){pet.cleaningDue=0;pet.waste=Math.max(0,pet.waste-(pet.cleaningCount||0));pet.cleaningCount=0;pet.clean=Math.min(100,pet.clean+25);say("Đã quét dọn xong.");}
  state.waste = pet.waste;
  updateHud();
  save();
}

/* Cần gạt chỉ chọn mục. SELECT xác nhận. */
const tree = {
  home: [
    "Cho ăn", "Sức khỏe", "Vệ sinh", "Ngủ",
    "Nựng / Chơi", "Kỷ luật", "Thời tiết", "Thông tin"
  ],
  "Thời tiết": ["📍 Dùng vị trí của tôi", "Xem thời tiết", "Cập nhật thời tiết"],
  "Cho ăn": ["Cơm", "Trái cây", "Snack"],
  "Sức khỏe": ["Nghỉ ngơi", "Uống thuốc", "Tình trạng"],
  "Vệ sinh": ["Dọn chất thải"],
  "Ngủ": ["Đi ngủ", "Thức dậy"],
  "Nựng / Chơi": ["Nựng", "Chơi cùng"],
  "Kỷ luật": ["Nhắc nhở", "Khen"],
  "Thông tin": ["Chỉ số", "Bộ đếm", "Đồng hồ", "Kết nối"]
};

let page = "home";
let index = 0;
let stack = [];
let opened = false;

function refresh() {
  panel.hidden = !opened;
  if (!opened) return;

  panel.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = page === "home" ? "MENU OHANA" : page;
  panel.append(heading);

  tree[page].forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "menu-row" + (i === index ? " active" : "");
    row.textContent = (i === index ? "▶ " : "  ") + name;
    panel.append(row);
  });

  if(page === "Thời tiết"){
    const info=document.createElement("p");
    info.textContent=weatherStatus.textContent;
    info.style.cssText="font-size:11px;color:#bcecff;line-height:1.5;padding:6px";
    panel.append(info);
  }
  panel.children[index + 1].scrollIntoView({ block: "nearest" });
}

function home() {
  touch();
  page = "home";
  index = 0;
  stack = [];
  opened = true;
  refresh();
}

function exit() {
  touch();
  opened = false;
  refresh();
}

function back() {
  touch();
  if (!opened) return;

  if (stack.length) {
    [page, index] = stack.pop();
    refresh();
  } else {
    exit();
  }
}

function move(step) {
  touch();

  if (!opened) {
    home();
  } else {
    index = (index + step + tree[page].length) % tree[page].length;
    refresh();
  }
}

function duration(milliseconds) {
  const minutes = Math.ceil(Math.max(0, milliseconds) / 60000);
  return Math.floor(minutes / 60) + "h " + minutes % 60 + "p";
}

function select() {
  touch();
  update();

  if (!opened) {
    home();
    return;
  }

  const name = tree[page][index];
  if ((pet.medicineDue || pet.cleaningDue) && !["Chỉ số","Tình trạng","Bộ đếm","Đồng hồ","Kết nối"].includes(name) && !tree[name]) {say("Chờ Stitch làm xong nhé."); return;}

  if (tree[name]) {
    stack.push([page, index]);
    page = name;
    index = 0;
    refresh();
    return;
  }

  if(page === "Thời tiết"){
    if(name === "📍 Dùng vị trí của tôi")locateWeather();
    else if(name === "Cập nhật thời tiết"){
      if(weather.coords)refreshWeather();else locateWeather();
    }
    refresh();return;
  }
  if (["Cơm", "Trái cây", "Snack"].includes(name)) {
    if (pet.sleep) {
      say("Để Stitch ngủ nhé.");
    } else if (hunger() < 15) {
      say("Stitch còn no, đừng cho ăn thêm nhé.");
    } else {
      pet.fed = Date.now();
      pet.digestion.push(
        Date.now() + (45 + Math.random() * 45) * 60000
      );
      state.meal = ["Cơm", "Trái cây", "Snack"].indexOf(name);
      animate(1);
      say("Măm măm! Độ đói sẽ tăng dần trong 9 giờ.");
    }

  } else if (name === "Dọn chất thải") {
    if (!pet.waste) {
      say("Chưa có chất thải để dọn.");
    } else {
      if(pet.sleep){say("Đánh thức Stitch trước nhé.");return;}
      pet.cleaningCount=pet.waste;pet.cleaningDue=Date.now()+5000;
      animate(8);
      say("Stitch đang quét dọn.");
    }

  } else if (name === "Uống thuốc") {
    if (!pet.sick) {
      say("Stitch khỏe, không cần uống thuốc.");
    } else {
      if(pet.sleep){say("Đánh thức Stitch trước nhé.");return;}
      pet.medicineDue=Date.now()+5000;
      animate(9);
      say("Stitch đang uống thuốc rồi uống nước.");
    }

  } else if (name === "Đi ngủ" || name === "Nghỉ ngơi") {
    pet.sleep = true;
    say("Ngủ hồi năng lượng. Chọn Thức dậy khi muốn.");

  } else if (name === "Thức dậy") {
    pet.sleep = false;
    say("Chào Ohana!");

  } else if (["Nựng", "Chơi cùng", "Khen"].includes(name)) {
    if (pet.sleep) {
      say("Stitch đang ngủ.");
    } else {
      pet.happy = Math.min(100, pet.happy + 15);
      if(name==="Chơi cùng" && (pet.sick||pet.energy<15)){say("Stitch cần nghỉ, chưa chạy được.");return;}
      animate(name==="Chơi cùng"?14:2,name==="Chơi cùng"?8:5);
      say("Ohana! Vui quá!");
    }

  } else if (name === "Nhắc nhở") {
    pet.discipline = Math.min(100, pet.discipline + 5);
    animate(10);
    say("Nhắc nhẹ thôi nhé!");

  } else if (name === "Bộ đếm") {
    say(
      "Đói hoàn toàn sau " +
      duration(pet.fed + 9 * HOUR - Date.now()) +
      " • Tiêu hóa: " +
      (pet.digestion.length
        ? duration(Math.min(...pet.digestion) - Date.now())
        : "chưa có")
    );

  } else if (name === "Chỉ số" || name === "Tình trạng") {
    say(
      "Đói " + Math.round(hunger()) +
      " • Vui " + Math.round(pet.happy) +
      " • Sức khỏe " + Math.round(pet.health) +
      " • Năng lượng " + Math.round(pet.energy) +
      " • Sạch " + Math.round(pet.clean) +
      " • Kỷ luật " + pet.discipline +
      " • Chất thải " + pet.waste +
      (pet.sick ? " • Đang ốm" : "")
    );

  } else if (name === "Đồng hồ") {
    say(new Date().toLocaleString("vi-VN"));

  } else {
    say("Chưa kết nối Adafruit / ESP32.");
  }

  updateHud();
  save();
  opened = false;
  refresh();
}

document.querySelectorAll("[data-step]").forEach(button => {
  button.onclick = () => move(Number(button.dataset.step));
});

document.getElementById("home").onclick = home;
document.getElementById("back").onclick = back;
document.getElementById("select").onclick = select;
document.getElementById("exit").onclick = exit;

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  const supported = [
    "arrowup", "arrowleft", "arrowdown", "arrowright",
    "enter", "escape", "h", "x"
  ];

  if (!supported.includes(key)) return;
  event.preventDefault();

  // Giữ SELECT không được xác nhận liên tiếp nhiều mục.
  if (event.repeat && ["enter", "h", "x", "escape"].includes(key)) {
    return;
  }

  if (key === "enter") select();
  else if (key === "escape") back();
  else if (key === "h") home();
  else if (key === "x") exit();
  else move(["arrowup", "arrowleft"].includes(key) ? -1 : 1);
});

/* Thời lượng hoạt động dùng đồng hồ thật. */
let lastFrame = "";
let lastUpdate = 0;

function loop(now) {
  if (now - lastUpdate > 1000) {
    update();
    lastUpdate = now;
  }

  const time = Date.now();
  const idle = time - lastInput;
  const hour = new Date().getHours();

  if (!opened && !end && !pet.medicineDue && !pet.cleaningDue && !pet.sleep && !pet.sick && pet.energy > 25) {
    if (idle >= 90000 && !idleDance) {
      idleDance = true;
      animate(11, 12);
      say("Stitch mặc váy lá nhảy Hawaii!");
    }

    if (idle >= 120000 && !idleCoconut) {
      idleCoconut = true;
      animate(12, 10);
      say("Gặm vỏ dừa cho vui — không tính là bữa ăn.");
    }
  }

  if (end && time > end) {
    temporary = 0;
    end = 0;
  }

  state.pose =
    pet.medicineDue ? 9 :
    pet.cleaningDue ? 8 :
    pet.sleep ? 4 :
    pet.sick ? 7 :
    end ? temporary :
    (hour >= 22 || hour < 6 || pet.energy < 25) ? 13 :
    hunger()>=80 ? 15 :
    0;

  const frame = Math.floor(now / 40) % 100000;
  const key = state.pose + ":" + frame + ":" + state.waste;

  if (key !== lastFrame) {
    render(state.pose, frame);
    lastFrame = key;
  }

  requestAnimationFrame(loop);
}

say("Ohana! HOME mở menu.");
update();
requestAnimationFrame(loop);
</script>
